/* Signature discrète : auteur, licence, version */
.signature{font-size:.7rem;font-weight:600;opacity:.45;text-align:right}
.signature a{color:inherit;text-decoration:none}
.signature a:hover{text-decoration:underline}
</style>
<style>
:root{
  --red:#e03e2d;--yellow:#f5c518;--green:#3daa44;--blue:#1e4d9b;--orange:#f47920;
  --brown:#5c3317;--white:#fffdf7;--dark:#1a1a2e;
  --reel-h:clamp(90px,22vh,240px);
  /* Mode sombre (par défaut) */
  --bg:var(--dark);--fg:#fff;--muted:rgba(255,255,255,.6);--q:rgba(255,255,255,.2);
  --panel:#20203a;--accent:var(--yellow);--line:rgba(255,255,255,.15);--soft:rgba(255,255,255,.08);
  --c-subj:#f5c518;--c-verb:#ffffff;
  --t-pres:#4cc25a;--t-imp:#5b9bff;--t-pc:#f47920;--t-fut:#ec4899;--t-ps:#a78bfa;--t-pqp:#f5c518;
}
/* Mode clair : fond crème, machine blanche, couleurs plus soutenues pour rester lisibles au tableau */
body.light{
  --bg:#9fdcca;--fg:#123a36;--muted:rgba(18,58,54,.65);--q:rgba(18,58,54,.25);
  --panel:#ecf9f5;--accent:#0b7a6f;--line:rgba(18,58,54,.2);--soft:rgba(18,58,54,.07);
  --c-subj:#c2410c;--c-verb:#123a36;
  /* couleurs des temps (correction) : passé composé, imparfait, futur = orange, bleu, framboise du titre ;
     présent émeraude ; passé simple violet ; plus-que-parfait ambre doré */
  --t-pres:#0b8550;--t-imp:#1864ab;--t-pc:#d9480f;--t-fut:#c2255c;--t-ps:#7048e8;--t-pqp:#a86400;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;
  background:var(--bg);color:var(--fg);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 20px 12px;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;
  background-image:
    radial-gradient(circle,var(--red) 2px,transparent 2px),
    radial-gradient(circle,var(--yellow) 2px,transparent 2px),
    radial-gradient(circle,var(--green) 2px,transparent 2px),
    radial-gradient(circle,var(--blue) 2px,transparent 2px),
    radial-gradient(circle,var(--orange) 2px,transparent 2px);
  background-size:120px 120px,80px 80px,100px 100px,90px 90px,70px 70px;
  background-position:0 0,40px 40px,20px 60px,60px 20px,10px 50px;
}
.container{
  position:relative;z-index:1;width:100%;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;
}

/* Titre */
.title-block{text-align:center}
h1{font-family:'Bangers',cursive;font-weight:400;font-size:clamp(2.2rem,5.2vw,5rem);letter-spacing:3px;line-height:1}
h1 .grad{
  background:linear-gradient(135deg,var(--yellow),var(--orange),var(--red));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 8px rgba(245,197,24,.4));
}

/* Boutons du haut */
.topbar{position:fixed;top:12px;display:flex;gap:8px;z-index:15}
.topbar.left{left:14px}
.topbar.right{right:14px}
.btn-icon{
  background:rgba(245,197,24,.06);border:2px solid rgba(245,197,24,.4);color:var(--yellow);   /* même famille que « Correction » */
  border-radius:12px;padding:7px 14px;font-size:.9rem;font-weight:800;cursor:pointer;
  font-family:inherit;transition:filter .15s,background .15s;
}
.btn-icon:hover{background:rgba(245,197,24,.16);border-color:var(--yellow)}
.btn-icon.off{opacity:.55}

/* Machine */
.machine{
  container-type:inline-size;
  width:min(96vw,1600px);
  background:linear-gradient(160deg,#2a2a4a 0%,#1a1a2e 100%);
  border:3px solid rgba(255,255,255,.12);border-radius:28px;
  padding:clamp(14px,2.2vw,32px);
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
  display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,24px);
  position:relative;overflow:hidden;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.rlights{display:flex;gap:clamp(6px,.8cqw,12px);justify-content:center;margin-bottom:2px}
.rlights i{width:clamp(8px,.85cqw,14px);height:clamp(8px,.85cqw,14px);border-radius:50%;animation:blink 1.6s ease-in-out infinite}
.rlights i:nth-child(1){background:var(--red);animation-delay:0s}
.rlights i:nth-child(2){background:var(--yellow);animation-delay:.15s}
.rlights i:nth-child(3){background:var(--green);animation-delay:.3s}
.rlights i:nth-child(4){background:var(--blue);animation-delay:.45s}
.rlights i:nth-child(5){background:var(--orange);animation-delay:.6s}
.col.rspin .rlights i{animation:chase .32s linear infinite}
.col.rspin .rlights i:nth-child(2){animation-delay:.064s}.col.rspin .rlights i:nth-child(3){animation-delay:.128s}
.col.rspin .rlights i:nth-child(4){animation-delay:.192s}.col.rspin .rlights i:nth-child(5){animation-delay:.256s}
@keyframes chase{0%,100%{opacity:.15}50%{opacity:1;box-shadow:0 0 8px currentColor}}
.col.rstop .rlights i{animation:stopflash 1s ease-out}
@keyframes stopflash{0%{opacity:1;transform:scale(1.5);box-shadow:0 0 12px 3px #fff}100%{opacity:1;transform:scale(1)}}
.reels{display:grid;grid-template-columns:1.5fr 1.2fr 1.3fr;gap:clamp(10px,2cqw,30px);width:100%}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{
  text-align:center;font-weight:900;color:var(--yellow);
  font-size:clamp(.8rem,1.5cqw,1.5rem);text-transform:uppercase;letter-spacing:.18em;
}
.reel{
  position:relative;overflow:hidden;cursor:pointer;
  height:var(--reel-h);background:#10163a;border-radius:18px;
  border:3px solid rgba(255,255,255,.1);
  box-shadow:inset 0 4px 20px rgba(0,0,0,.8);
}
.reel::before,.reel::after{content:'';position:absolute;left:0;right:0;height:22%;z-index:3;pointer-events:none}
.reel::before{top:0;background:linear-gradient(to bottom,#10163a,transparent)}
.reel::after{bottom:0;background:linear-gradient(to top,#10163a,transparent)}
.band{
  position:absolute;top:50%;left:0;right:0;height:46%;transform:translateY(-50%);
  border-top:2px solid rgba(245,197,24,.6);border-bottom:2px solid rgba(245,197,24,.6);
  background:rgba(245,197,24,.04);z-index:2;pointer-events:none;
}
.reel:hover{border-color:rgba(245,197,24,.5)}
.reel{--glow:#f5c518}
.reel.stop{animation:pop .45s ease-out,glow .95s ease-out}
@keyframes glow{0%{box-shadow:inset 0 4px 20px rgba(0,0,0,.8),0 0 0 0 var(--glow)}35%{box-shadow:inset 0 4px 20px rgba(0,0,0,.8),0 0 28px 5px var(--glow)}100%{box-shadow:inset 0 4px 20px rgba(0,0,0,.8),0 0 0 0 transparent}}
.reel.stop .band{animation:bandflash .8s ease-out}
@keyframes bandflash{0%{background:rgba(255,255,255,.35)}100%{background:rgba(245,197,24,.04)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.strip{will-change:transform}
.cell{
  height:var(--reel-h);display:flex;align-items:center;justify-content:center;
  font-weight:900;white-space:nowrap;padding:0 .2em;line-height:1.1;
}
.r0 .cell{font-size:clamp(30px,6cqw,110px)}
.r1 .cell{font-size:clamp(24px,5cqw,92px)}
.r2 .cell{font-size:clamp(15px,2.7cqw,56px);text-transform:uppercase}
.cell>span{white-space:nowrap}
.answer .line{display:inline-block;white-space:nowrap}
.answer .pr{font-size:.68em;font-weight:800;opacity:.8;margin:0 .1em}
/* Correction : terminaison en surbrillance, auxiliaire encadré, accord du participe souligné */
.answer .end{background:var(--tc,#fff);color:#1a1a2e;border-radius:.16em;padding:0 .07em;font-weight:900}
.answer .iss{font-style:normal;background:rgba(255,255,255,.16);border-radius:.12em}
.answer .aux{border:.07em solid currentColor;border-radius:.3em;padding:0 .12em;margin-right:.04em}
.answer .acc{text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.14em}
.answer.show .line{animation:rise .5s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(.35em) scale(.96)}to{opacity:1;transform:none}}
.answer.show .end{animation:endpulse 1s .45s ease-out both}
@keyframes endpulse{0%{box-shadow:0 0 0 0 var(--tc)}40%{box-shadow:0 0 .55em .12em var(--tc);filter:brightness(1.25)}100%{box-shadow:0 0 0 0 transparent}}

#spin{
  font-family:inherit;font-weight:900;letter-spacing:1px;cursor:pointer;border:2px solid transparent;border-radius:50px;
  background:linear-gradient(135deg,var(--yellow),var(--orange));background-origin:border-box;color:var(--brown);
  font-size:clamp(.95rem,1.8cqw,1.8rem);padding:.5em 1.5em;min-width:clamp(150px,16cqw,320px);
  box-shadow:0 6px 20px rgba(245,197,24,.4);
  transition:transform .15s,filter .15s,box-shadow .15s;
}
#spin:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 8px 28px rgba(245,197,24,.6)}
#spin:active:not(:disabled){transform:translateY(0)}
#spin:disabled{opacity:.45;cursor:not-allowed}
.machine.spinning #spin{animation:pulse .4s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(245,197,24,.4)}50%{box-shadow:0 6px 40px rgba(245,197,24,.9)}}
.machine.flash{animation:flash .7s ease}
@keyframes flash{0%,100%{background-color:transparent}30%{box-shadow:0 0 70px rgba(245,197,24,.55),0 20px 60px rgba(0,0,0,.5)}}

.actions{display:flex;gap:clamp(10px,1.6cqw,24px);align-items:center;justify-content:center;flex-wrap:wrap}
#show{
  font-family:inherit;font-weight:800;cursor:pointer;border-radius:50px;color:var(--yellow);
  background:rgba(245,197,24,.08);border:2px solid rgba(245,197,24,.6);
  font-size:clamp(.95rem,1.8cqw,1.8rem);padding:.5em 1.5em;min-width:clamp(150px,16cqw,320px);transition:filter .15s,background .15s;
}
#show:hover:not(:disabled){background:rgba(245,197,24,.18)}
#show:disabled{opacity:.35;cursor:not-allowed}
.answer{
  width:100%;min-height:clamp(46px,7.5cqw,100px);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(22px,4.6cqw,84px);text-align:center;padding:.1em .5em;line-height:1.1;
  border-radius:18px;background:rgba(245,197,24,.08);border:2px dashed rgba(245,197,24,.5);
  visibility:hidden;opacity:0;transition:opacity .3s;
}
.answer.show{visibility:visible;opacity:1}


/* Dessins de la récompense : doivent tenir entre les deux lignes jaunes */
.cell.sym svg{width:calc(var(--reel-h)*.34);height:calc(var(--reel-h)*.34);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.reel.win{border-color:var(--yellow);animation:winpulse .9s ease-in-out 3}
@keyframes winpulse{0%,100%{box-shadow:inset 0 4px 20px rgba(0,0,0,.8),0 0 10px 1px rgba(245,197,24,.4)}50%{box-shadow:inset 0 4px 20px rgba(0,0,0,.8),0 0 36px 8px rgba(245,197,24,.85)}}
.reel.win .cell.sym svg{animation:symbounce .9s ease-in-out 3}
@keyframes symbounce{0%,100%{transform:scale(1)}50%{transform:scale(1.14) rotate(-4deg)}}
.machine.jackpot{animation:jackglow 1.1s ease-in-out 3}
@keyframes jackglow{0%,100%{box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}50%{box-shadow:0 0 90px rgba(245,197,24,.55),0 20px 60px rgba(0,0,0,.5)}}

/* Confettis */
.celebration{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti-piece{position:absolute;border-radius:50%;animation:fall 1.5s ease-in forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Message */
#msg{
  position:fixed;left:50%;top:14vh;transform:translateX(-50%);z-index:30;
  background:var(--panel);color:var(--fg);border:2px solid var(--yellow);padding:.7em 1.2em;border-radius:14px;
  font-weight:800;font-size:clamp(14px,1.6vw,24px);opacity:0;pointer-events:none;transition:opacity .25s;
  text-align:center;max-width:90vw;
}
#msg.show{opacity:1}

/* Panneau d'options : même présentation que la fenêtre « Imprimer » (fenêtre flottante sous son bouton) */
#drawer{
  position:fixed;top:56px;right:14px;z-index:20;width:min(36rem,94vw);max-height:calc(100vh - 70px);
  background:var(--panel);color:var(--fg);border:2px solid var(--yellow);border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;
  visibility:hidden;opacity:0;transform:translateY(-6px);transition:opacity .15s,transform .15s,visibility .15s;
}
#drawer.open{visibility:visible;opacity:1;transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem .1rem}
.d-head h2{font-size:1.05rem;font-weight:900;color:var(--accent)}
.d-head .btn-icon{padding:2px 10px;border-radius:50px;font-size:.85rem}
.d-body{overflow:auto;padding:0 1rem 1rem;flex:1;font-size:.95rem;font-weight:600;line-height:1.35}
.sec{margin-top:.75rem}
.sec h3,.sec summary{
  margin:0 0 .2rem;font-size:.8rem;font-weight:800;color:var(--accent);
  text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
}
.sec summary{cursor:pointer;list-style:none;margin-bottom:0}
.sec summary::-webkit-details-marker{display:none}
.sec summary::before{content:'▸';font-size:1.1em;width:.8em}
.sec[open] summary::before{content:'▾'}
.sec[open] summary{margin-bottom:.2rem}
.sec h3 .n,.sec summary .n{font-weight:600;color:var(--muted);font-size:.8rem;letter-spacing:0;text-transform:none}
.mini{
  font-family:inherit;font-size:.75rem;font-weight:800;letter-spacing:0;text-transform:none;
  border:1px solid var(--line);background:var(--soft);color:var(--fg);
  border-radius:50px;padding:1px 10px;cursor:pointer;
}
.mini:hover{border-color:var(--accent)}
/* Section « Verbes » : une ligne courte par catégorie (case, titre, compteur à droite) */
.vgrp{display:flex;align-items:flex-start;gap:.5rem}
.vgrp>input{width:1.1em;height:1.1em;accent-color:var(--accent);margin:.38em 0 0;flex:none;cursor:pointer}
.vgrp details{flex:1;min-width:0}
.sec .vgrp summary{display:flex;align-items:center;gap:.5rem;padding:.2rem 0;margin:0;cursor:pointer;list-style:none;
  text-transform:none;letter-spacing:0;font-size:.95rem;font-weight:700;color:var(--fg)}
.sec .vgrp summary::before{content:none}
.vgrp summary::-webkit-details-marker{display:none}
.vgrp summary .vt{flex:1}
.vgrp summary .vt::after{content:' ▸';color:var(--muted)}
.vgrp details[open] summary .vt::after{content:' ▾'}
.vgrp summary .n{color:var(--muted);font-size:.85em}
.vgrp .chips{margin:.1rem 0 .4rem}
/* cases à cocher alignées en colonnes, comme dans la fenêtre « Imprimer » */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr));gap:0 .9rem}
.chip{display:flex;align-items:center;gap:.5rem;padding:.15rem 0;cursor:pointer;user-select:none}
.chip input,.opt-line input{width:1.1em;height:1.1em;accent-color:var(--accent);margin:0;flex:none}
.star{color:var(--accent);font-weight:900}
.quick{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.opt-line{display:flex;gap:.5rem;align-items:flex-start;padding:.15rem 0;cursor:pointer}
.opt-line input{margin-top:.15em}
.legend{font-size:.82em;font-style:italic;color:var(--muted);margin-top:.2rem}
.sub{font-weight:800;margin:.5rem 0 .1rem}

/* Mode sombre : SUJET, VERBE, TEMPS dans les tons chauds du titre */
body:not(.light) .col:nth-child(1) .label{color:#f5c518}
body:not(.light) .col:nth-child(2) .label{color:#f47920}
body:not(.light) .col:nth-child(3) .label{color:#ff6b5e}

/* Fenêtre « Imprimer » */
.pop{position:fixed;z-index:25;display:none;width:min(27rem,92vw);max-height:calc(100vh - 70px);overflow:auto;
  background:var(--panel);color:var(--fg);border:2px solid var(--yellow);border-radius:16px;padding:.8rem 1rem 1rem;
  font-size:.95rem;font-weight:600;line-height:1.35;box-shadow:0 10px 40px rgba(0,0,0,.55)}
.pop .pt{font-weight:900;font-size:1.05rem;color:var(--accent);margin-bottom:.2rem}
.pop .psrc{font-size:.85em;color:var(--muted);margin-bottom:.4rem}
.pop fieldset{border:0;margin:.6rem 0 0;padding:0}
.pop legend{font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-size:.8rem;padding:0;margin-bottom:.2rem}
.pop label{display:flex;align-items:center;gap:.5rem;padding:.15rem 0;cursor:pointer}
.pop label:has(input:disabled){opacity:.4;cursor:not-allowed}
.pop .inl{display:flex;gap:1.2rem}
.pop input{width:1.1em;height:1.1em;accent-color:var(--accent);margin:0}
.pop .pnote{font-size:.82em;font-style:italic;color:var(--muted)}
.pop .pwarn{display:none;margin-top:.4rem;padding:.35rem .55rem;border-left:.25rem solid var(--orange);background:rgba(244,121,32,.14);font-size:.85em;border-radius:.3rem}
.pop .go{display:block;margin:.9rem 0 0 auto;font-family:inherit;font-weight:900;cursor:pointer;border:0;border-radius:50px;
  background:linear-gradient(135deg,var(--yellow),var(--orange));color:var(--brown);font-size:1rem;padding:.5rem 1.2rem}
.pop .go:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Mode clair : vert d'eau. Titre et bouton « Lancer » passent du jaune-orangé aux tons sarcelle,
   rouleaux pétrole foncé ; seul le texte des rouleaux garde les couleurs vives ---------- */
body.light::before{opacity:.14}
/* titre : dégradé doux orange → framboise → bleu dans chaque mot, liseré blanc pour ressortir sur le vert */
body.light h1 .grad{background:none;filter:none}
body.light h1 .grad span{display:inline-block;padding:0 .04em;
  background:linear-gradient(100deg,#f76707 0%,#d6336c 50%,#1c7ed6 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 5px 6px rgba(18,58,54,.3))}
/* boutons du haut et bouton « Correction » : texte et contour sarcelle, même famille que « Lancer » */
body.light .btn-icon{background:rgba(255,255,255,.55);border-color:rgba(11,122,111,.45);color:var(--accent)}
body.light .btn-icon:hover{filter:none;background:rgba(255,255,255,.85);border-color:var(--accent)}
body.light .machine{background:linear-gradient(160deg,#f2fbf8 0%,#b5e6d8 100%);border-color:rgba(15,110,102,.18);
  box-shadow:0 18px 50px rgba(15,80,75,.25),inset 0 1px 0 rgba(255,255,255,.7)}
/* SUJET, VERBE, TEMPS : une couleur par rouleau, sur une pastille blanche */
body.light .label{align-self:center;background:#fff;border-radius:50px;padding:.1em .9em;box-shadow:0 2px 6px rgba(18,58,54,.15)}
body.light .col:nth-child(1) .label{color:#e8590c}
body.light .col:nth-child(2) .label{color:#1864ab}
body.light .col:nth-child(3) .label{color:#c2255c}
/* rouleaux : fond pétrole foncé, textes aux couleurs vives */
body.light .reel{
  background:#173b3e;border-color:rgba(15,110,102,.35);box-shadow:inset 0 4px 18px rgba(0,0,0,.5);
  --c-subj:#f5c518;--c-verb:#ffffff;--q:rgba(255,255,255,.25);
  --t-pres:#3fd38b;--t-imp:#74b3ff;--t-pc:#ff8a3d;--t-fut:#f0609e;--t-ps:#b197fc;--t-pqp:#fcc419;
}
body.light .reel::before{background:linear-gradient(to bottom,#173b3e,transparent)}
body.light .reel::after{background:linear-gradient(to top,#173b3e,transparent)}
body.light .band{border-color:rgba(94,234,212,.55);background:rgba(94,234,212,.06)}
body.light .reel:hover{border-color:rgba(15,110,102,.7)}
/* bouton « Lancer » et bouton « Créer le fichier Word » : sarcelle */
body.light #spin,body.light .pop .go{background:linear-gradient(135deg,#14a39a,#0f766e);color:#fff;box-shadow:0 6px 20px rgba(15,118,110,.35)}
body.light #spin:hover:not(:disabled){box-shadow:0 8px 28px rgba(15,118,110,.5)}
body.light .machine.spinning #spin{animation:pulseTeal .4s ease infinite}
@keyframes pulseTeal{0%,100%{box-shadow:0 6px 20px rgba(15,118,110,.35)}50%{box-shadow:0 6px 40px rgba(20,163,154,.8)}}
body.light #show{color:var(--accent);background:rgba(255,255,255,.55);border-color:var(--accent)}
body.light #show:hover:not(:disabled){background:rgba(255,255,255,.85)}
body.light .answer{background:rgba(255,255,255,.45);border-color:rgba(15,110,102,.45)}
body.light .answer .end{color:#fff}
body.light .answer .iss{background:rgba(23,58,58,.12)}
body.light #msg{background:var(--panel);color:var(--fg);border-color:var(--accent)}
body.light .pop,body.light #drawer{border-color:var(--accent);box-shadow:0 10px 40px rgba(15,80,75,.3)}
body.light .pop .pwarn{border-left-color:#c24f00;background:rgba(194,79,0,.1)}

body.fs .topbar{opacity:.25}
body.fs .topbar:hover{opacity:1}

/* Écran très bas (téléphone en paysage) : titre plus petit et sous la barre de boutons */
@media (max-height:500px) and (orientation:landscape){
  body{padding-top:44px;padding-bottom:0}
  h1{font-size:clamp(1.3rem,3.6vw,1.9rem)}
  .container{gap:.6vh;justify-content:flex-start}
  :root{--reel-h:clamp(64px,19vh,100px)}
  .btn-icon{padding:4px 9px;font-size:.78rem}
  .topbar{top:8px;gap:6px}
}

/* Picto du son (le même dans la gym des mots, la machine à conjuguer et à qui le tour) : barré quand le son est coupé */
.ico-son{width:1.35em;height:1.35em;display:block}
.ico-pe{width:1.35em;height:1.35em;display:block}
#snd,#fs{display:inline-flex;align-items:center;justify-content:center;padding:5px 11px}
</style>

<script>
/* Machine à conjuguer — créée par M. Guitton, avec l'aide de Claude AI */
/* ============================================================
   DONNÉES — modifiables : ajoutez, retirez ou remplacez des éléments ici.
   ============================================================ */
const DATA = {
  /* Pronoms personnels sujets.
     p = personne (0 je · 1 tu · 2 il/elle/on · 3 nous · 4 vous · 5 ils/elles)
     g = genre pour l'accord avec « être » ('both' = il, elle / ils, elles) */
  pronoms: [
    {id:'je',       t:'je',         p:0, g:'x',    p3:false},
    {id:'tu',       t:'tu',         p:1, g:'x',    p3:false},
    {id:'ilelle',   t:'il, elle',   p:2, g:'both', p3:true},
    {id:'on',       t:'on',         p:2, g:'m',    p3:true},
    {id:'nous',     t:'nous',       p:3, g:'x',    p3:false},
    {id:'vous',     t:'vous',       p:4, g:'x',    p3:false},
    {id:'ilselles', t:'ils, elles', p:5, g:'both', p3:true}
  ],
  /* Groupes nominaux : [texte, genre 'm'|'f' (pour l'accord), nombre 's'|'p', 'a' si c'est un animal].
     Remplacez les prénoms par ceux de vos élèves si vous le souhaitez. */
  gn: [
    ['le chat','m','s','a'], ['mon grand-père','m','s'], ['le maître','m','s'], ['ton voisin','m','s'],
    ['l’oiseau','m','s','a'], ['le petit garçon','m','s'], ['mon cousin','m','s'], ['Hugo','m','s'],
    ['la petite fille','f','s'], ['ta sœur','f','s'], ['la maîtresse','f','s'], ['ma voisine','f','s'],
    ['l’infirmière','f','s'], ['ma tante','f','s'], ['Léa','f','s'],
    ['les enfants','m','p'], ['les élèves','m','p'], ['mes parents','m','p'], ['les voisins','m','p'],
    ['tes cousins','m','p'], ['les garçons','m','p'], ['nos amis','m','p'], ['le chat et le chien','m','p','a'],
    ['Emma et Noah','m','p'], ['mon père et ma mère','m','p'], ['Hugo et Léa','m','p'],
    ['les petites filles','f','p'], ['mes sœurs','f','p'], ['les filles','f','p'], ['nos voisines','f','p'],
    ['tes cousines','f','p'], ['les maîtresses','f','p'], ['Jade et Inès','f','p'], ['ma sœur et ma cousine','f','p']
  ],
  /* Sujets multiples : [texte, personne, 'm' si le groupe contient un masculin] — 3 = équivaut à « nous », 4 = équivaut à « vous ».
     Accord avec « être » : 'm' → toujours masculin pluriel (« Léo et moi sommes allés ») ;
     sinon le genre dépend de « moi » / « toi » → (e)s (« Sarah et moi sommes allé(e)s »).
     Si vous changez un prénom, mettez 'm' pour un garçon, rien pour une fille. */
  multiples: [
    ['toi et moi',3], ['Léo et moi',3,'m'], ['Sarah et moi',3], ['Inès et moi',3],
    ['ma sœur et moi',3], ['mes parents et moi',3,'m'],
    ['Lucie et toi',4], ['Hugo et toi',4,'m'], ['Zoé et toi',4], ['Noah et toi',4,'m'],
    ['ton frère et toi',4,'m'], ['tes parents et toi',4,'m']
  ],
  /* Verbes qu'un animal peut faire (un groupe nominal « animal » n'est jamais tiré avec un autre verbe).
     « commun » = tous les animaux ; les autres entrées s'ajoutent pour un animal précis. */
  animalVerbs: {
    commun: ['manger','boire','courir','regarder','écouter','jouer','marcher','crier','tomber','arriver','entrer','rester',
             'sortir','partir','venir','aller','voir','être','avoir','grandir','grossir','maigrir','vieillir','bondir',
             'atterrir','guérir','réagir','se laver','se coucher','se réveiller','se lever','se reposer','se cacher',
             's’arrêter','s’amuser','se blottir'],
    'l’oiseau': ['chanter'],
    'le chat': ['se promener'],
    'le chat et le chien': ['se promener']
  },
  temps: ['présent','imparfait','passé composé','futur','passé simple','plus-que-parfait'],
  /* Verbes. Une * après le verbe = se conjugue avec « être » au passé composé.
     Pour le 1er groupe, ['verbe','ge'|'c'|'y'|'l'|'t'|'e'] indique une particularité d'orthographe
     (mangeons, commençons, nettoie, appelle, jette, achète). */
  groupes: [
    {id:'g1',  g:'g1', titre:'1er groupe : verbes simples', verbes:[
      'chanter','jouer','regarder','parler','aimer','marcher','crier','donner','trouver','penser',
      'porter','danser','écouter','demander','montrer','travailler','habiter','laver','utiliser',
      'raconter','dessiner','étudier','entrer*','rester*','tomber*','arriver*'
    ]},
    {id:'g1p', g:'g1', titre:'1er groupe : verbes à particularité', verbes:[
      ['ranger','ge'],['manger','ge'],['voyager','ge'],['nager','ge'],['partager','ge'],['changer','ge'],
      ['commencer','c'],['lancer','c'],['placer','c'],['avancer','c'],
      ['nettoyer','y'],['essuyer','y'],['employer','y'],
      ['appeler','l'],['jeter','t'],
      ['acheter','e'],['lever','e']
    ]},
    {id:'g2',  g:'g2', titre:'2ᵉ groupe', verbes:[
      'finir','choisir','grandir','réussir','remplir','obéir','grossir','réfléchir','punir','applaudir',
      'agir','bâtir','rougir','pâlir','vieillir','maigrir','ralentir','saisir','nourrir','guérir',
      'bondir','démolir','réagir','avertir','atterrir'
    ]},
    {id:'g3a', g:'g3', titre:'3ᵉ groupe : verbes à connaître', verbes:[
      'être','avoir','aller','faire','dire','venir','prendre','pouvoir','vouloir','voir','devoir','savoir'
    ]},
    {id:'g3b', g:'g3', titre:'3ᵉ groupe : autres verbes', verbes:[
      'partir','sortir','mettre','lire','écrire','connaître','attendre','rendre',
      'courir','ouvrir','recevoir','tenir','boire','croire','vivre','suivre'
    ]},
    {id:'pro', g:'mix', titre:'verbes pronominaux', verbes:[
      'se laver','se coucher','se réveiller','s’habiller','se dépêcher','s’amuser','se reposer','se cacher','s’arrêter',
      ['se promener','e'],['se lever','e'],['s’appeler','l'],
      'se réjouir','se blottir','s’évanouir',
      'se mettre','se rendre'
    ]}
  ]
};
/* Verbes pronominaux : « se laver », « s’habiller »… (inf = verbe sans le pronom, refl = vrai) ; ils se conjuguent avec « être » */
const mkVerb = x => {
  const arr = Array.isArray(x), s = arr ? x[0] : x, star = !arr && s.endsWith('*');
  const v = star ? s.slice(0,-1) : s, o = {v}, m = v.match(/^(?:se |s’)(.+)$/);
  if(arr) o.t = x[1];
  if(star) o.aux = 'être';
  if(m){ o.refl = true; o.inf = m[1]; o.aux = 'être'; }
  return o;
};
const groupOf = (v, g) => g!=='mix' ? g : (v.inf.endsWith('er') ? 'g1' : v.inf.endsWith('ir') ? 'g2' : 'g3');   // section mixte : le groupe se déduit de l’infinitif
const ALL_VERBS = DATA.groupes.flatMap(s => s.verbes.map(x => { const o = mkVerb(x); return {...o, g:groupOf(o, s.g), sec:s.id}; }));

/* Tous les sujets possibles du premier rouleau (pronoms, groupes nominaux, sujets multiples) */
const SUBJECTS = [
  ...DATA.pronoms.map(x => ({...x, kind:'pron'})),
  ...DATA.gn.map(([t,g,n,a]) => ({id:'gn:'+t, t, kind:'gn', animal:(a==='a'), p:(n==='p'?5:2), g, p3:true,
                                pr:(n==='p' ? (g==='f'?'elles':'ils') : (g==='f'?'elle':'il'))})),
  ...DATA.multiples.map(([t,p,m]) => ({id:'va:'+t, t, kind:'multi', p, g:(m==='m' ? 'm' : 'xp'), p3:false, pr:(p===3?'nous':'vous')}))   // 'xp' = pluriel, genre inconnu
];
/* Un sujet et un verbe vont-ils ensemble ? (un animal ne « conjugue » que les verbes de DATA.animalVerbs) */
const verbOk = (s, verb) => !s.animal || DATA.animalVerbs.commun.includes(verb) || (DATA.animalVerbs[s.t]||[]).includes(verb);
const SUBJ_BY_TEXT = Object.fromEntries(SUBJECTS.map(s => [s.t, s]));

/* ============================================================
   CONJUGAISON — génère la correction pour chaque tirage.
   1er et 2ᵉ groupes : règles automatiques.
   3ᵉ groupe : table IRR ci-dessous (un verbe absent de la table
   n'a simplement pas de correction).
   ============================================================ */
const PERS = {je:0, tu:1, il:2, elle:2, on:2, nous:3, vous:4, ils:5, elles:5};
const AUX = {
  'avoir':{pres:['ai','as','a','avons','avez','ont'],
           impf:['avais','avais','avait','avions','aviez','avaient']},
  'être': {pres:['suis','es','est','sommes','êtes','sont'],
           impf:['étais','étais','était','étions','étiez','étaient']}
};
const END_IMPF = ['ais','ais','ait','ions','iez','aient'];
const END_FUT  = ['ai','as','a','ons','ez','ont'];
const END_PS = {
  is:['is','is','it','îmes','îtes','irent'],
  us:['us','us','ut','ûmes','ûtes','urent'],
  in:['ins','ins','int','înmes','întes','inrent'],
  ai:['ai','as','a','âmes','âtes','èrent']
};

/* pres = 6 formes du présent ; impf = radical de l'imparfait ; fut = radical du futur ;
   ps = [radical, type] du passé simple ; pp = participe passé ; aux = auxiliaire (avoir par défaut) */
const IRR = {
  'être':     {pres:['suis','es','est','sommes','êtes','sont'], impf:'ét', fut:'ser', ps:['f','us'], pp:'été'},
  'avoir':    {pres:['ai','as','a','avons','avez','ont'], impf:'av', fut:'aur', ps:['e','us'], pp:'eu'},
  'aller':    {pres:['vais','vas','va','allons','allez','vont'], impf:'all', fut:'ir', ps:['all','ai'], pp:'allé', aux:'être'},
  'faire':    {pres:['fais','fais','fait','faisons','faites','font'], impf:'fais', fut:'fer', ps:['f','is'], pp:'fait'},
  'dire':     {pres:['dis','dis','dit','disons','dites','disent'], impf:'dis', fut:'dir', ps:['d','is'], pp:'dit'},
  'venir':    {pres:['viens','viens','vient','venons','venez','viennent'], impf:'ven', fut:'viendr', ps:['v','in'], pp:'venu', aux:'être'},
  'prendre':  {pres:['prends','prends','prend','prenons','prenez','prennent'], impf:'pren', fut:'prendr', ps:['pr','is'], pp:'pris'},
  'pouvoir':  {pres:['peux','peux','peut','pouvons','pouvez','peuvent'], impf:'pouv', fut:'pourr', ps:['p','us'], pp:'pu'},
  'vouloir':  {pres:['veux','veux','veut','voulons','voulez','veulent'], impf:'voul', fut:'voudr', ps:['voul','us'], pp:'voulu'},
  'voir':     {pres:['vois','vois','voit','voyons','voyez','voient'], impf:'voy', fut:'verr', ps:['v','is'], pp:'vu'},
  'devoir':   {pres:['dois','dois','doit','devons','devez','doivent'], impf:'dev', fut:'devr', ps:['d','us'], pp:'dû'},
  'savoir':   {pres:['sais','sais','sait','savons','savez','savent'], impf:'sav', fut:'saur', ps:['s','us'], pp:'su'},
  'partir':   {pres:['pars','pars','part','partons','partez','partent'], impf:'part', fut:'partir', ps:['part','is'], pp:'parti', aux:'être'},
  'sortir':   {pres:['sors','sors','sort','sortons','sortez','sortent'], impf:'sort', fut:'sortir', ps:['sort','is'], pp:'sorti', aux:'être'},
  'mettre':   {pres:['mets','mets','met','mettons','mettez','mettent'], impf:'mett', fut:'mettr', ps:['m','is'], pp:'mis'},
  'lire':     {pres:['lis','lis','lit','lisons','lisez','lisent'], impf:'lis', fut:'lir', ps:['l','us'], pp:'lu'},
  'écrire':   {pres:['écris','écris','écrit','écrivons','écrivez','écrivent'], impf:'écriv', fut:'écrir', ps:['écriv','is'], pp:'écrit'},
  'connaître':{pres:['connais','connais','connaît','connaissons','connaissez','connaissent'], impf:'connaiss', fut:'connaîtr', ps:['conn','us'], pp:'connu'},
  'attendre': {pres:['attends','attends','attend','attendons','attendez','attendent'], impf:'attend', fut:'attendr', ps:['attend','is'], pp:'attendu'},
  'rendre':   {pres:['rends','rends','rend','rendons','rendez','rendent'], impf:'rend', fut:'rendr', ps:['rend','is'], pp:'rendu'},
  'courir':   {pres:['cours','cours','court','courons','courez','courent'], impf:'cour', fut:'courr', ps:['cour','us'], pp:'couru'},
  'ouvrir':   {pres:['ouvre','ouvres','ouvre','ouvrons','ouvrez','ouvrent'], impf:'ouvr', fut:'ouvrir', ps:['ouvr','is'], pp:'ouvert'},
  'recevoir': {pres:['reçois','reçois','reçoit','recevons','recevez','reçoivent'], impf:'recev', fut:'recevr', ps:['reç','us'], pp:'reçu'},
  'tenir':    {pres:['tiens','tiens','tient','tenons','tenez','tiennent'], impf:'ten', fut:'tiendr', ps:['t','in'], pp:'tenu'},
  'boire':    {pres:['bois','bois','boit','buvons','buvez','boivent'], impf:'buv', fut:'boir', ps:['b','us'], pp:'bu'},
  'croire':   {pres:['crois','crois','croit','croyons','croyez','croient'], impf:'croy', fut:'croir', ps:['cr','us'], pp:'cru'},
  'vivre':    {pres:['vis','vis','vit','vivons','vivez','vivent'], impf:'viv', fut:'vivr', ps:['véc','us'], pp:'vécu'},
  'suivre':   {pres:['suis','suis','suit','suivons','suivez','suivent'], impf:'suiv', fut:'suivr', ps:['suiv','is'], pp:'suivi'}
};

/* Modèle d'un verbe : 6 formes par temps simple + participe passé + auxiliaire.
   v = {v:'manger', g:'g1'|'g2'|'g3', t: variante orthographique du 1er groupe}
   t : 'ge' (mangeons) · 'c' (commençons) · 'y' (nettoie) · 'l' (appelle) · 't' (jette) · 'e' (achète)
   psE = les 6 terminaisons du passé simple (pour pouvoir les mettre en évidence) */
function modelOf(v){ const m = modelOf0(v); if(m && v.refl) m.aux = 'être'; return m; }
function modelOf0(v){
  const inf = v.inf || v.v, base = inf.slice(0,-2);
  if(v.g==='g3'){
    const s = IRR[inf]; if(!s) return null;
    return {
      pres: s.pres,
      impf: END_IMPF.map(e=>s.impf+e),
      fut:  END_FUT.map(e=>s.fut+e),
      ps:   END_PS[s.ps[1]].map(e=>s.ps[0]+e), psE: END_PS[s.ps[1]],
      pp: s.pp, aux: s.aux || 'avoir'
    };
  }
  if(v.g==='g2'){
    const psE = ['is','is','it','îmes','îtes','irent'];
    return {
      pres: ['is','is','it','issons','issez','issent'].map(e=>base+e),
      impf: ['issais','issais','issait','issions','issiez','issaient'].map(e=>base+e),
      fut:  END_FUT.map(e=>inf+e),
      ps:   psE.map(e=>base+e), psE,
      pp: base+'i', aux: v.aux || 'avoir'
    };
  }
  if(v.g==='g1'){
    const t = v.t, ao = /^[aâo]/;
    const fix = end =>
      (t==='ge' && ao.test(end)) ? base+'e'+end :
      (t==='c'  && ao.test(end)) ? base.slice(0,-1)+'ç'+end :
      base+end;
    let sm = base;                                    // radical devant e muet
    if(t==='y') sm = base.slice(0,-1)+'i';
    if(t==='l') sm = base+'l';
    if(t==='t') sm = base+'t';
    if(t==='e') sm = base.replace(/e([^e]*)$/,'è$1');
    const psE = ['ai','as','a','âmes','âtes','èrent'];
    return {
      pres: [sm+'e', sm+'es', sm+'e', fix('ons'), fix('ez'), sm+'ent'],
      impf: END_IMPF.map(fix),
      fut:  END_FUT.map(e=>sm+'er'+e),
      ps:   psE.map(fix), psE,
      pp: base+'é', aux: v.aux || 'avoir'
    };
  }
  return null;
}

/* Découpage radical / terminaison (pour la mise en évidence dans la correction) */
const ENDS_PRES = [['ai','e','s','x'],['es','s','x'],['t','d','e','a'],['ons','mes'],['ez','es'],['ent','ont','nt']];
/* Participes : on ne met en évidence que -é, -i, -u, -û. Les formes irrégulières (pris, mis, fait, dit, écrit, ouvert, eu, été…) restent sans surbrillance. */
const ENDS_PP = ['é','i','u','û'];
/* Présent des verbes très irréguliers : rien n'est mis en évidence quand la terminaison est discutable. */
const UNSURE_PRES = {'être':[0,1,2,3,4,5], 'aller':[0,1,2,3,4,5], 'avoir':[0,2,5], 'faire':[4,5], 'dire':[4]};
const cutPres = (inf, form, i) => (UNSURE_PRES[inf] && UNSURE_PRES[inf].includes(i)) ? [form,''] : cut(form, ENDS_PRES[i]);
const cutPP = (inf, pp) => (inf==='être' || inf==='avoir') ? [pp,''] : cut(pp, ENDS_PP);
function cut(form, ends){
  for(const e of [...ends].sort((a,b)=>b.length-a.length))
    if(form.length>=e.length && form.endsWith(e)) return [form.slice(0,-e.length), e];
  return [form, ''];
}
const tail = (form, e) => [form.slice(0,-e.length), e];

/* Accord du participe passé avec « être » selon la personne (i) et le genre (g).
   Quand le genre est inconnu (je, tu, nous, vous), on écrit (e) et (s) entre parenthèses.
   Participe terminé par -s ou -x (mis, assis…) : pas de -s ajouté au masculin pluriel (« ils s'étaient mis », « nous nous sommes mis(es) »). */
function accord(i, g, endsS){
  if(i===0 || i===1) return '(e)';
  /* sujets multiples (toujours pluriels) : masculin connu, ou genre inconnu */
  if((i===3 || i===4) && g==='m')  return endsS ? '' : 's';
  if((i===3 || i===4) && g==='xp') return endsS ? '(es)' : '(e)s';
  if(i===2) return g==='f' ? 'e' : '';
  if(i===3) return endsS ? '(es)' : '(e)s';
  if(i===4) return '(e)(s)';
  return g==='f' ? 'es' : (endsS ? '' : 's');
}

/* Forme du verbe seule, sans le sujet, découpée : {aux:[radical,terminaison]|null, main:[radical,terminaison], acc:'accord'}
   (null si le verbe n'est pas connu) */
/* Verbes pronominaux : on ajoute « me / te / se / nous / vous » (avec élision : m’, t’, s’) */
function verbParts(s, v, tense, g){
  const vp = verbParts0(s, v, tense, g);
  if(vp && v.refl){
    const R = ['me','te','se','nous','vous','se'][s.p], first = vp.aux ? vp.aux[0]+vp.aux[1] : vp.main[0]+vp.main[1];
    vp.refl = (R.length===2 && /^[aeiouyhàâéèêëîïôùûœ]/i.test(first)) ? R[0]+'’' : R+' ';
  }
  return vp;
}
function verbParts0(s, v, tense, g){
  const m = modelOf(v); if(!m) return null;
  const i = s.p;
  /* 2e groupe : « -iss- » est signalé d'une teinte discrète ; au singulier du présent la terminaison est -is, -is, -it */
  const iss = v.g==='g2' ? 'iss' : null;
  if(tense==='présent')      return {aux:null, iss, acc:'', main:(iss && i<3) ? tail(m.pres[i], ['is','is','it'][i]) : cutPres(v.inf||v.v, m.pres[i], i)};
  if(tense==='imparfait')    return {aux:null, iss, main:tail(m.impf[i], END_IMPF[i]), acc:''};
  if(tense==='futur')        return {aux:null, iss:'r', main:tail(m.fut[i], END_FUT[i]), acc:''};
  if(tense==='passé simple') return {aux:null, main:tail(m.ps[i], m.psE[i]), acc:''};
  if(tense==='passé composé' || tense==='plus-que-parfait'){
    const A = AUX[m.aux];
    const aux = tense==='passé composé' ? cutPres(m.aux, A.pres[i], i) : tail(A.impf[i], END_IMPF[i]);
    return {aux, main:cutPP(v.inf||v.v, m.pp), acc: m.aux==='être' ? accord(i,g,/[sx]$/.test(m.pp)) : ''};
  }
  return null;
}
const partText = vp => (vp.refl||'') + (vp.aux ? vp.aux[0]+vp.aux[1]+' ' : '') + vp.main[0]+vp.main[1]+vp.acc;
const hiEnd = t => t ? '<b class="end">'+t+'</b>' : '';
const partHtml = vp => (vp.refl||'') + (vp.aux ? '<span class="aux">'+vp.aux[0]+hiEnd(vp.aux[1])+'</span> ' : '')
                     + (vp.iss && vp.main[0].endsWith(vp.iss) ? vp.main[0].slice(0,-vp.iss.length)+'<i class="iss">'+vp.iss+'</i>' : vp.main[0]) + hiEnd(vp.main[1]) + (vp.acc ? '<u class="acc">'+vp.acc+'</u>' : '');

/* Correction complète, en texte et en HTML (null si inconnue) :
   « j’ai chanté » · « il / elle mange » · « il est allé / elle est allée »
   « les enfants (ils) mangent » · « toi et moi (nous) mangeons » */
function build(s, v, tense){
  if(typeof s === 'string') s = SUBJ_BY_TEXT[s];
  if(!s) return null;
  if(s.g==='both'){
    const a = verbParts(s,v,tense,'m'), b = verbParts(s,v,tense,'f');
    if(!a || !b) return null;
    const [pm, pf] = s.t.split(', '), ta = partText(a), tb = partText(b);
    if(ta===tb) return {text: pm+' / '+pf+' '+ta, html: pm+' / '+pf+' '+partHtml(a)};
    return {text: pm+' '+ta+' / '+pf+' '+tb, html: pm+' '+partHtml(a)+' / '+pf+' '+partHtml(b)};
  }
  const vp = verbParts(s,v,tense,s.g);
  if(!vp) return null;
  const t = partText(vp), hh = partHtml(vp);
  if(s.kind==='pron'){
    if(s.t==='je' && /^[aeiouyhàâéèêëîïôùûœ]/i.test(t)) return {text:'j’'+t, html:'j’'+hh};
    return {text: s.t+' '+t, html: s.t+' '+hh};
  }
  return {text: s.t+' ('+s.pr+') '+t, html: s.t+' <span class="pr">('+s.pr+')</span> '+hh};
}
const conjugate = (s,v,t) => { const r = build(s,v,t); return r ? r.text : null; };
const conjugateHtml = (s,v,t) => { const r = build(s,v,t); return r ? r.html : null; };

function colorFor(i, t){

/* ============================================================
   SON (synthétisé, aucun fichier audio)
   ============================================================ */
/* Le navigateur interdit le son tant que l'utilisateur n'a rien cliqué : le contexte audio démarre « suspendu »
   et son réveil (resume) prend un court instant. Pour ne perdre aucun son :
   1. le contexte est créé dès l'ouverture de la page (étape lente faite d'avance) ;
   2. il est réveillé au premier geste (clic, touche, toucher), avec un son silencieux qui déverrouille Safari / iPad ;
   3. les actions sonores attendent que le son soit vraiment prêt (initAudio) ;
   4. tant qu'il ne l'est pas, les sons sont ignorés (ctx() renvoie null). */
let actx = null;
function prepareAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'}); }
  catch(e){ actx = null; }
}
/* Renvoie une promesse résolue quand le son est prêt (état « running »), ou au plus tard après 250 ms */
function initAudio(){
  prepareAudio();
  if(!actx || actx.state==='running') return Promise.resolve();
  try{
    const silence = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
    src.buffer = silence; src.connect(actx.destination); src.start(0);
  }catch(e){}
  const c = actx;
  const running = new Promise(done => {
    c.addEventListener('statechange', function onChange(){
      if(c.state==='running'){ c.removeEventListener('statechange', onChange); done(); }
    });
    c.resume().catch(()=>{});
  });
  return Promise.race([running, new Promise(done => setTimeout(done, 250))]);
}
/* Contexte utilisable pour jouer un son, sinon null (son ignoré) */
const ctx = () => (actx && actx.state==='running') ? actx : null;
prepareAudio();
['pointerdown','keydown','touchend'].forEach(ev => document.addEventListener(ev, initAudio, true));
function tone(freq, start, dur, type, vol, endFreq){
  if(!S.sound) return;
  const c = ctx(); if(!c) return;
  const t0 = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.001, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+.03);
}
const NOTES = [523.25, 659.25, 783.99];            // do, mi, sol
/* Bruit filtré (clac, claquement) */
function noise(start, dur, vol, ftype, freq, q){
  if(!S.sound) return;
  const c = ctx(); if(!c) return;
  const t0 = c.currentTime + start;
  const len = Math.max(1, Math.floor(c.sampleRate*dur));
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let k=0;k<len;k++) d[k] = Math.random()*2-1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q || 1;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.001, t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur+.02);
}

/* Son d'arrêt des rouleaux : butée métallique (claquement + choc sourd + tintement d'acier).
   i = 0, 1, 2 : le choc est un peu plus grave et le tintement un peu plus aigu à chaque rouleau. */
function click(t, vol){                       // claquement sec de la butée
  noise(t,.012,vol,'highpass',3500);
  noise(t,.03,vol*.8,'bandpass',1800,1.2);
}
function thud(t, f, vol, dur){                // choc sourd du rouleau qui s'immobilise
  tone(f,t,dur,'sine',vol,f*.35);
  noise(t,.05,vol*.7,'lowpass',900);
}
const STOP_VOL = .38;                          // volume relatif de la butée (1 = niveau d'origine) : baissez-le pour un son plus discret
function playStop(i){
  const v = STOP_VOL;
  click(0,.5*v); thud(0,[140,120,100][i],.3*v,.12);
  tone(2350+i*180,0,.35,'sine',.05*v); tone(3470+i*250,0,.22,'sine',.035*v);
  noise(0,.25,.06*v,'bandpass',3000,12);
}


const sfx = {
  lever(){ tone(160,0,.3,'sawtooth',.07,520); },
  tick(i){ tone([900,760,640][i],0,.045,'square',.035); },
  stop(i){ playStop(i); },
  jackpot(){
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,k)=>tone(f,k*.09,.4,'triangle',.17));
    [1046.5,1318.5,1568,2093].forEach((f,k)=>tone(f,.55+k*.08,.5,'sine',.12));
    for(let k=0;k<6;k++) tone(1800+k*120,.2+k*.12,.12,'square',.04);
    for(let k=0;k<8;k++) tone(2600+Math.random()*1400,.7+k*.08,.12,'sine',.025);     // étincelles
  },
  blip(){ tone(880,0,.12,'triangle',.15); },
  reveal(){ tone(1046.5,0,.22,'sine',.045); tone(1568,.08,.32,'sine',.035); },      // carillon discret à l'affichage de la correction
  denied(){ tone(240,0,.2,'triangle',.06,170); }                                  // réglages impossibles
};

const optsEl = document.getElementById('opts');
const counters = [];

function chip(kind, id, label, star, tip){
  const l = document.createElement('label'); l.className='chip';
  const c = document.createElement('input'); c.type='checkbox'; c.checked = isOn(kind,id);
  c.dataset.kind = kind; c.dataset.id = id;
  c.addEventListener('change', ()=>{ setOn(kind,id,c.checked); save(); refreshCounts(); });
  l.append(c, document.createTextNode(label));
  if(tip) l.title = tip;
  return l;
}
function mkBtn(txt, fn){ const b=document.createElement('button'); b.className='mini'; b.textContent=txt; b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); fn(); }; return b; }   // preventDefault : ne referme pas la section repliable
function section(title, kind, items, fold){
  const sec = document.createElement(fold ? 'details' : 'div'); sec.className='sec';     // fold = section repliable (fermée au départ)
  const h = document.createElement(fold ? 'summary' : 'h3'); h.textContent = title+' ';
  const n = document.createElement('span'); n.className='n'; h.append(n);
  h.append(
    mkBtn('Tout',  ()=>bulk(kind, items.map(i=>i.id), true)),
    mkBtn('Aucun', ()=>bulk(kind, items.map(i=>i.id), false))
  );
  const chips = document.createElement('div'); chips.className='chips';
  items.forEach(i=>chips.append(chip(kind,i.id,i.label,i.star,i.tip)));
  sec.append(h,chips);
  counters.push({n, kind, ids: items.map(i=>i.id)});
  return sec;
}
function bulk(kind, ids, on){ ids.forEach(id=>setOn(kind,id,on)); save(); syncChecks(); refreshCounts(); }
function syncChecks(){
  optsEl.querySelectorAll('input[type=checkbox][data-kind]').forEach(c=>{
    c.checked = isOn(c.dataset.kind, c.dataset.id);
  });
}
function refreshCounts(){
  counters.forEach(c=>{
    const on = c.ids.filter(id=>isOn(c.kind,id)).length;
    c.n.textContent = c.bare ? on+'/'+c.ids.length : '('+on+'/'+c.ids.length+')';
    if(c.cb){                                    // case de catégorie : cochée, à moitié cochée ou vide
      c.cb.checked = on===c.ids.length;
      c.cb.indeterminate = on>0 && on<c.ids.length;
    }
  });
}
/* Titre court d'une catégorie de verbes : « 1er groupe : simples », « Pronominaux »… */
const shortTitle = t => { t = t.replace(': verbes ', ': ').replace(/ verbes$/, '').replace(/^verbes /, ''); return t.charAt(0).toUpperCase()+t.slice(1); };
/* Section « Verbes » : un titre commun (Tout / Aucun pour tous les verbes), puis une ligne courte par catégorie.
   Sur chaque ligne : une case (coche ou décoche toute la catégorie), le titre (clic = déplier la liste), le compteur à droite. */
function verbSection(){
  const groups = DATA.groupes.map(g=>({titre:g.titre, ids:g.verbes.map(x=>mkVerb(x).v)}));
  const all = groups.flatMap(g=>g.ids);
  const sec = document.createElement('div'); sec.className = 'sec';
  const h = document.createElement('h3'); h.textContent = 'Verbes ';
  const n = document.createElement('span'); n.className = 'n'; h.append(n,
    mkBtn('Tout',  ()=>bulk('verbs', all, true)),
    mkBtn('Aucun', ()=>bulk('verbs', all, false)));
  counters.push({n, kind:'verbs', ids:all});
  sec.append(h);
  groups.forEach(g=>{
    /* La case est placée à côté de la liste repliable (et non dedans) : un clic dessus ne déplie rien
       et le navigateur ne lui remet pas son ancien état. */
    const row = document.createElement('div'); row.className = 'vgrp';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.title = 'Cocher / décocher toute la catégorie';
    cb.addEventListener('change', ()=>bulk('verbs', g.ids, !g.ids.every(id=>isOn('verbs',id))));   // tout coché → tout décocher, sinon tout cocher
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    const lab = document.createElement('span'); lab.className = 'vt'; lab.textContent = shortTitle(g.titre);
    const cnt = document.createElement('span'); cnt.className = 'n';
    sum.append(lab, cnt);
    const chips = document.createElement('div'); chips.className = 'chips';
    g.ids.forEach(v=>chips.append(chip('verbs', v, v)));
    det.append(sum, chips);
    row.append(cb, det);
    counters.push({n:cnt, kind:'verbs', ids:g.ids, cb, bare:true});
    sec.append(row);
  });
  return sec;
}
function optLine(txt, val, fn){
  const l = document.createElement('label'); l.className='opt-line';
  const c = document.createElement('input'); c.type='checkbox'; c.checked = val;
  c.onchange = ()=>fn(c.checked);

let prevDraw = S.last || null;       // dernier tirage mémorisé (pour ne pas le répéter tout de suite)

const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
