const SYMBOLS = Object.keys(SVG);
const isSym = t => typeof t === 'string' && t.startsWith('sym:');
const cell = (t,i) => isSym(t)
  ? '<div class="cell sym"><svg viewBox="0 0 64 64" aria-hidden="true">'+SVG[t]+'</svg></div>'
  : '<div class="cell" style="color:'+colorFor(i,t)+'"><span>'+t+'</span></div>';

/* Réduit la taille du texte des cases trop larges pour le rouleau (« mon père et ma mère », « PLUS-QUE-PARFAIT »…) */
function fitStrip(i){
  const reel = reels[i], avail = reel.clientWidth * 0.9;
  const cells = [...reel.querySelectorAll('.cell:not(.sym)')];
  if(!avail || !cells.length) return;
  cells.forEach(c=>{ c.style.fontSize = ''; });
  const info = cells.map(c=>({c, w:(c.firstElementChild ? c.firstElementChild.offsetWidth : 0), fs:parseFloat(getComputedStyle(c).fontSize)}));
  info.forEach(o=>{ if(o.w > avail) o.c.style.fontSize = (o.fs * avail / o.w) + 'px'; });
}

/* ------------------------------------------------------------
   RÈGLES DU TIRAGE
   - le passé simple n'est jamais associé à un sujet hors 3e personne (si la limite est cochée)
   - toutes les personnes (je, tu, il, nous, vous, ils) sortent à égalité : on tire d'abord la personne,
     puis la forme de sujet qui l'exprime (pronom, groupe nominal, sujet multiple), puis un temps compatible
   - jamais deux fois de suite le même tirage ni le même verbe
   ------------------------------------------------------------ */
const subjectIsOn = s => isOn('pron', s.kind==='pron' ? s.id : s.kind);     // cases « gn » et « multi » pour les groupes
const tensesOn = () => DATA.temps.filter(t=>isOn('temps',t));
const verbsOn  = () => ALL_VERBS.filter(v=>isOn('verbs',v.v)).map(v=>v.v);
const compat   = (p3, tense) => !(S.ps3 && tense==='passé simple') || p3;

/* Familles de sujets cochées : chacune exprime une seule personne */
function subjectFamilies(verb){
  const vs = verbsOn(), okS = s => verb ? verbOk(s, verb) : vs.some(x => verbOk(s, x));
  const fam = [];
  DATA.pronoms.forEach(x=>{ if(isOn('pron',x.id)){ const s = SUBJ_BY_TEXT[x.t]; if(okS(s)) fam.push({p:s.p, p3:s.p3, items:[s]}); } });
  if(isOn('pron','gn'))    [2,5].forEach(p=>{ const items = SUBJECTS.filter(s=>s.kind==='gn'    && s.p===p && okS(s)); if(items.length) fam.push({p, p3:true,  items}); });
  if(isOn('pron','multi')) [3,4].forEach(p=>{ const items = SUBJECTS.filter(s=>s.kind==='multi' && s.p===p && okS(s)); if(items.length) fam.push({p, p3:false, items}); });
  return fam;
}

/* Le couple sujet + temps affiché est-il encore permis par les réglages actuels ? */
function validCombo(sText, verb, tense){
  const s = SUBJ_BY_TEXT[sText];
  return !!s && subjectIsOn(s) && tensesOn().includes(tense) && verbsOn().includes(verb) && verbOk(s, verb) && compat(s.p3, tense);
}

/* Message explicite si les réglages ne permettent aucun tirage valide (sinon null) */
function problem(){
  const fams = subjectFamilies(), tenses = tensesOn(), verbs = verbsOn();
  if(!fams.length)   return 'Coche au moins un sujet dans les options.';
  if(!verbs.length)  return 'Coche au moins un verbe dans les options.';
  if(!tenses.length) return 'Coche au moins un temps dans les options.';
  if(!fams.some(f => tenses.some(t => compat(f.p3, t))))
    return 'Aucun tirage possible : le passé simple est limité à la 3e personne, mais aucun sujet de 3e personne n’est coché '
         + '(il, elle, on, ils, elles, groupes nominaux). Coche un de ces sujets ou un autre temps, '
         + 'ou décoche la limite dans « Autres options ».';
  return null;
}

/* Tirage complet. prev = tirage précédent {p, v, t} : on évite de le répéter (et de répéter son verbe) */
function drawFull(prev){
  const tenses = tensesOn(), verbs = verbsOn();
  const usable = subjectFamilies().filter(f => tenses.some(t => compat(f.p3, t)));
  const persons = [...new Set(usable.map(f => f.p))];
  let soft = null, last = null;
  for(let n=0; n<16; n++){
    const p = pick(persons);
    const f = pick(usable.filter(x => x.p===p));
    const s = pick(f.items);
    const t = pick(tenses.filter(t => compat(f.p3, t)));
    const v = pick(verbs.filter(x => verbOk(s, x)));
    last = [s.t, v, t];
    if(!prev) return last;
    const sameTriple = (s.t===prev.p && v===prev.v && t===prev.t);
    const sameVerb   = (verbs.length>1 && v===prev.v);
    const samePair   = (s.t===prev.p && t===prev.t);
    if(!sameTriple && !sameVerb && !samePair) return last;
    if(!sameTriple && !soft) soft = last;
  }
  return soft || last;
}
/* Nouveau sujet compatible avec le temps affiché (null = aucun autre choix possible) */
function drawSubjectFor(tense, avoidText, verb){
  const usable = subjectFamilies(verb).filter(f => compat(f.p3, tense));
  const persons = [...new Set(usable.map(f => f.p))];
  if(!persons.length) return null;
  for(let n=0; n<12; n++){
    const f = pick(usable.filter(x => x.p === pick(persons)));
    const s = f ? pick(f.items) : null;
    if(s && s.t !== avoidText) return s;
  }
  const others = usable.flatMap(f => f.items).filter(x => x.t !== avoidText);
  return others.length ? pick(others) : null;
}
/* Nouveau temps compatible avec le sujet affiché */
function drawTenseFor(subject, avoidTense){
  const alt = tensesOn().filter(t => compat(subject.p3, t) && t !== avoidTense);
  return alt.length ? pick(alt) : null;
}
/* Nouveau verbe */
function drawVerbFor(avoid, subject){
  const alt = verbsOn().filter(v => v !== avoid && (!subject || verbOk(subject, v)));
  return alt.length ? pick(alt) : null;
}

/* Dessins de récompense : un « sac » mélangé, pour ne jamais montrer deux fois de suite le même dessin */
let symBag = [], lastSym = S.lastSym || null;
function nextSymbol(){
  if(!symBag.length){
    symBag = shuffle([...SYMBOLS]);
    if(symBag[symBag.length-1] === lastSym) symBag.unshift(symBag.pop());
  }
  lastSym = symBag.pop();
  S.lastSym = lastSym; save();
  return lastSym;
}

/* ------------------------------------------------------------
   CORRECTION : terminaisons en surbrillance, auxiliaire encadré, accord du participe souligné
   ------------------------------------------------------------ */
const showBtn = document.getElementById('show'), ansEl = document.getElementById('answer');
let last = null;
function setLast(){ last = {p:cur[0], v:cur[1], t:cur[2]}; showBtn.disabled = false; }
function hideAnswer(){ ansEl.classList.remove('show'); showBtn.disabled = true; last = null; }
function toggleAnswer(){
  if(!last) return;
  if(ansEl.classList.contains('show')){ ansEl.classList.remove('show'); return; }
  const v = ALL_VERBS.find(x=>x.v===last.v), s = SUBJ_BY_TEXT[last.p];
  let html = (v && s) ? conjugateHtml(s, v, last.t) : null;
  if(html && !S.hl) html = conjugate(s, v, last.t).replace(/\((ils?|elles?|nous|vous)\)/g, '<span class="pr">($1)</span>');   // option décochée : texte simple
  const color = TENSE_COLORS[last.t] || 'var(--c-verb)';
  if(html) ansEl.innerHTML = '<span class="line">' + html + '</span>';
  else     ansEl.textContent = 'Correction indisponible pour ce verbe';
  ansEl.style.color = html ? color : 'var(--muted)';
  ansEl.style.setProperty('--tc', color);
  ansEl.classList.add('show');
  fitAnswer();
  if(html) initAudio().then(()=>sfx.reveal());
}
/* La correction tient toujours sur une seule ligne */
function fitAnswer(){
  ansEl.style.fontSize = '';
  const sp = ansEl.firstElementChild; if(!sp) return;
  const avail = ansEl.clientWidth * 0.94, w = sp.offsetWidth;
  if(avail && w > avail) ansEl.style.fontSize = (parseFloat(getComputedStyle(ansEl).fontSize) * avail / w) + 'px';
}
window.addEventListener('resize', ()=>{ if(!busy) [0,1,2].forEach(fitStrip); fitAnswer(); });
showBtn.onclick = ()=>{ toggleAnswer(); showBtn.blur(); };

let toastTimer;
function toast(t, ms){
  const m = document.getElementById('msg'); m.textContent = t; m.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>m.classList.remove('show'), ms || 3200);
}

/* ------------------------------------------------------------
   EFFETS DE RÉCOMPENSE
   ------------------------------------------------------------ */
function celebrate(){
  const box = document.getElementById('celebration');
  box.innerHTML = '';
  const cols = ['#E03E2D','#F5C518','#3DAA44','#1E4D9B','#F47920','#EC4899'];
  for(let k=0;k<110;k++){
    const p = document.createElement('div'); p.className='confetti-piece';
    const s = 6+Math.random()*9;
    p.style.cssText = 'left:'+Math.random()*100+'vw;top:-10px;width:'+s+'px;height:'+s+'px;background:'+pick(cols)+
      ';animation-delay:'+Math.random()*1+'s;animation-duration:'+(1.4+Math.random()*1)+'s';
    box.appendChild(p);
  }
  machine.classList.add('jackpot');
  setTimeout(()=>machine.classList.remove('jackpot'), 3200);
  setTimeout(()=>{ box.innerHTML=''; }, 3900);
}

/* tic-tac qui ralentit avec le rouleau */
function ticks(i, dur){
  const t0 = performance.now();
  (function step(){
    const e = performance.now()-t0;
    if(e >= dur-80) return;
    sfx.tick(i);
    const p = e/dur;
    setTimeout(step, p<.55 ? 90 : 90 + 700*Math.pow((p-.55)/.45,2));
  })();
}

/* Défilement : démarrage rapide, vitesse de croisière bien visible, puis freinage progressif */
const SPEED = 11;                     // mots par seconde en vitesse de croisière
const RAMP = .08, CRUISE = .55;       // fin de l'accélération, fin de la croisière (fractions de la durée)
const SHAPE = RAMP/2 + (CRUISE-RAMP) + (1-CRUISE)/3;

function animateStrip(strip, cells, total, dur){
  return new Promise(res=>{
    const v = cells / SHAPE, T2 = 1-CRUISE, t0 = performance.now();
    function frame(now){
      const t = Math.min((now-t0)/dur, 1);
      let pos;
      if(t < RAMP)        pos = v*t*t/(2*RAMP);
      else if(t < CRUISE) pos = v*RAMP/2 + v*(t-RAMP);
      else{
        const u = (t-CRUISE)/T2;
        pos = v*(RAMP/2 + (CRUISE-RAMP)) + v*T2*(1-Math.pow(1-u,3))/3;
      }
      strip.style.transform = 'translateY('+(-pos/total*100)+'%)';
      if(t<1) requestAnimationFrame(frame); else res();
    }
    requestAnimationFrame(frame);
  });
}

async function spinReel(i, pool, target, dur){
  const strip = reels[i].querySelector('.strip'), col = reels[i].parentElement;
  col.classList.add('rspin');
  const n = Math.max(5, Math.round(SPEED*(dur/1000)*SHAPE) - 1);
  const arr = [cur[i] ?? '?'];
  const rnd = () => Math.random()<.3 ? pick(SYMBOLS) : pick(pool);
  for(let k=0;k<n;k++){
    let c = rnd(), g = 0;
    while(c === arr[arr.length-1] && g++ < 6) c = rnd();      // pas deux cases identiques à la suite
    arr.push(c);
  }
  if(arr[arr.length-1] === target) arr[arr.length-1] = isSym(target) ? pick(pool) : pick(SYMBOLS);
  arr.push(target);
  strip.style.transition = 'none';
  strip.style.transform = 'translateY(0)';
  strip.innerHTML = arr.map(t=>cell(t,i)).join('');
  fitStrip(i);
  ticks(i, dur);
  await animateStrip(strip, arr.length-1, arr.length, dur);
  strip.innerHTML = cell(target,i);
  fitStrip(i);
  strip.style.transform = 'translateY(0)';
  cur[i] = target;
  reels[i].style.setProperty('--glow', isSym(target) ? 'var(--yellow)' : colorFor(i,target));
  reels[i].classList.add('stop');
  setTimeout(()=>reels[i].classList.remove('stop'), 950);
  sfx.stop(i);
  col.classList.remove('rspin'); col.classList.add('rstop');
  setTimeout(()=>col.classList.remove('rstop'),1000);
}

async function spin(which){
  if(busy) return;
  const prob = problem();
  if(prob){
    toast(prob, prob.length > 90 ? 9000 : 3800);
    initAudio().then(()=>sfx.denied());
    openDrawer();
    return;
  }
  let idx = which ?? [0,1,2];
  /* le tirage affiché n'est plus compatible avec les réglages (ou il n'y en a pas encore) : on relance les trois rouleaux */
  if(idx.length===1 && !validCombo(cur[0], cur[1], cur[2])) idx = [0,1,2];

  const reward = idx.length===3 && S.reward>0 && done >= S.reward;
  const next = [cur[0],cur[1],cur[2]];

  if(reward){
    const sym = nextSymbol();
    next[0] = next[1] = next[2] = sym;
  }else if(idx.length===3){
    const d = drawFull(prevDraw);
    next[0] = d[0]; next[1] = d[1]; next[2] = d[2];
  }else{
    const i = idx[0];
    if(i===0){
      const s = drawSubjectFor(cur[2], cur[0], cur[1]);
      if(!s){ toast('Aucun autre sujet possible avec ce temps (voir les options).'); return; }
      next[0] = s.t;
    }else if(i===1){
      const v = drawVerbFor(cur[1], SUBJ_BY_TEXT[cur[0]]);
      if(!v){ toast('Aucun autre verbe possible avec ce sujet (voir les options).'); return; }
      next[1] = v;
    }else{
      const t = drawTenseFor(SUBJ_BY_TEXT[cur[0]], cur[2]);
      if(!t){ toast('Aucun autre temps possible avec ce sujet (voir les options).'); return; }
      next[2] = t;
    }
  }

  busy = true; btn.disabled = true; machine.classList.add('spinning');
  reels.forEach(r=>r.classList.remove('win'));
  hideAnswer();
  await initAudio();             // attendre que le son soit prêt : le premier tirage est entendu en entier
  sfx.lever();
  const pools = [[...new Set(subjectFamilies().flatMap(f => f.items.map(x => x.t)))], verbsOn(), tensesOn()];
  const durs  = [1900,2900,3900];
  await Promise.all(idx.map(i=>spinReel(i, pools[i], next[i], durs[i])));
  machine.classList.remove('spinning');
  if(reward){
    done = 0; rewardShown = true;
    reels.forEach(r=>r.classList.add('win'));
    sfx.jackpot(); celebrate();
  }else{
    if(idx.length===3){ done++; rewardShown = false; }
    setLast();
    prevDraw = {p:cur[0], v:cur[1], t:cur[2]};          // mémorise le dernier tirage
    S.last = prevDraw; save();
  }
  if(idx.length===3){
    machine.classList.add('flash');
    setTimeout(()=>machine.classList.remove('flash'),700);
  }
  busy = false; btn.disabled = false;
}

btn.onclick = ()=>spin();
// Après une récompense, un clic sur un rouleau relance les 3 (jamais un dessin seul)
reels.forEach(r=>r.addEventListener('click', ()=>spin(rewardShown ? undefined : [+r.dataset.i])));

document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){ closeDrawer(); return; }
  if(drawer.classList.contains('open') || printOpen() || tag==='input' || tag==='button') return;
  if(e.code==='Space' || e.key==='Enter'){ e.preventDefault(); spin(); }
  if(e.key==='o' || e.key==='O'){ openDrawer(); }
  if(e.key==='c' || e.key==='C'){ toggleAnswer(); }
});

/* ============================================================
   IMPRESSION — fiche d'exercices au format Word (.docx), sur le modèle du calcul mental.
   Les exercices suivent les mêmes règles que la machine : sujets, verbes et temps cochés
   dans les Options, personnes à égalité, passé simple limité à la 3ᵉ personne si l'option est cochée.
   Plan : 1. tirage des exercices · 2. corrigé · 3. fichier Word · 4. fenêtre « Imprimer »
   ============================================================ */

/* ---------- 1. Tirage des exercices ---------- */
/* Un exercice {s: sujet, v: verbe, t: temps} ; tense = temps imposé (null = au hasard parmi les temps cochés) */
function drawPrintItem(tense){
  const tenses = tense ? [tense] : tensesOn();
  const usable = subjectFamilies().filter(f => tenses.some(t => compat(f.p3, t)));
  if(!usable.length) return null;
  const p = pick([...new Set(usable.map(f => f.p))]);      // la personne d'abord : toutes sortent à égalité
  const f = pick(usable.filter(x => x.p===p)), s = pick(f.items);
  const t = pick(tenses.filter(t => compat(f.p3, t)));
  const vs = verbsOn().filter(v => verbOk(s, v));
  return vs.length ? {s:s.t, v:pick(vs), t} : null;
}
/* n exercices différents : jamais deux fois le même, pas le même verbe ni le même sujet sur deux lignes qui se suivent,
   et tous les verbes cochés passent avant qu'un verbe revienne. Ces deux dernières règles sont levées
   si les réglages sont trop restreints. La liste peut être plus courte que n s'il n'existe pas assez d'exercices différents. */
function makePrintItems(tense, n){
  const out = [], seen = new Set(), used = new Set(), nVerbs = verbsOn().length;
  for(let k=0; out.length<n && k<n*120; k++){
    const it = drawPrintItem(tense); if(!it) break;
    const key = it.s+'|'+it.v+'|'+it.t;
    if(seen.has(key)) continue;
    const strict = k < n*60, prev = out[out.length-1];
    if(strict && prev && (prev.v===it.v || prev.s===it.s)) continue;
    if(strict && used.has(it.v)) continue;
    seen.add(key); used.add(it.v); out.push(it);
    if(used.size >= nVerbs) used.clear();
  }
  return out;
}
const capFirst = t => t.charAt(0).toUpperCase() + t.slice(1);
/* Temps imprimables : cochés, et avec au moins un sujet compatible (passé simple limité à la 3ᵉ personne) */
const printTenses = () => tensesOn().filter(t => subjectFamilies().some(f => compat(f.p3, t)));
/* Séries de la fiche : une seule (temps mélangés) ou une par temps coché */
function printSections(mode, n){
  const pt = printTenses();
  if(pt.length===1) return [{title:'', tense:pt[0], items:makePrintItems(pt[0], n)}];   // un seul temps : il va dans la consigne
  if(mode==='mix') return [{title:'', tense:null, items:makePrintItems(null, n)}];
  return printTenses().map(t => ({title:capFirst(t), tense:t, items:makePrintItems(t, n)}));
}

/* ---------- 2. Corrigé : la correction de la machine, découpée en morceaux mis en forme ---------- */
/* Renvoie [{t: texte, cls: ['end'|'aux'|'acc'|'pr'…]}] ; suit l'option « mettre en valeur les terminaisons » */
function answerSegments(it){
  const v = ALL_VERBS.find(x => x.v===it.v), s = SUBJ_BY_TEXT[it.s];
  const plain = (v && s) ? conjugate(s, v, it.t) : null;
  if(!plain) return [{t:'—', cls:[]}];
  const html = S.hl ? conjugateHtml(s, v, it.t)
                    : plain.replace(/\((ils?|elles?|nous|vous)\)/g, '<span class="pr">($1)</span>');
  const segs = [], stack = [];
  html.split(/(<[^>]+>)/).forEach(tok => {
    if(!tok) return;
    if(tok[0]==='<'){
      if(tok[1]==='/') stack.pop();
      else { const m = tok.match(/class="(\w+)"/); stack.push(m ? m[1] : ''); }
    } else segs.push({t:tok, cls:[...stack]});
  });
  return segs;
}

/* ---------- 3. Fichier Word (.docx) fabriqué sans bibliothèque : XML Office Open + archive ZIP « stockée » ---------- */
const DOCX = (function(){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const FONT = '<w:rFonts w:ascii="Cambria" w:hAnsi="Cambria" w:cs="Cambria"/>';
  const SZ = 24;                                                    /* 12 pt */
  /* mise en forme d'un morceau de texte (ordre des balises imposé par Word) */
  const rpr = o => '<w:rPr>'+FONT+(o.b?'<w:b/>':'')+(o.col?'<w:color w:val="'+o.col+'"/>':'')
    +'<w:sz w:val="'+(o.sz||SZ)+'"/><w:szCs w:val="'+(o.sz||SZ)+'"/>'+(o.u?'<w:u w:val="single"/>':'')
    +(o.box?'<w:bdr w:val="single" w:sz="6" w:space="0" w:color="000000"/>':'')
    +(o.shd?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.shd+'"/>':'')+'</w:rPr>';
  const tR = (s,o={}) => s ? '<w:r>'+rpr(o)+'<w:t xml:space="preserve">'+esc(s)+'</w:t></w:r>' : '';
  /* corrigé : terminaison en gras sur fond gris, auxiliaire encadré, accord souligné, pronom de rappel plus petit */
  const ansRuns = segs => segs.map(g => tR(g.t, {
    b: g.cls.includes('end') || g.cls.includes('acc'),
    shd: g.cls.includes('end') ? 'D9D9D9' : null,
    box: g.cls.includes('aux'),
    u: g.cls.includes('acc'),
    sz: g.cls.includes('pr') ? 20 : null,
    col: g.cls.includes('pr') ? '555555' : null
  })).join('');
  const para = (inner,o={}) => '<w:p><w:pPr>'+(o.keep?'<w:keepNext/>':'')+(o.pb?'<w:pageBreakBefore/>':'')+(o.bdr||'')+(o.tabs||'')
    +'<w:spacing w:before="'+(o.bef||0)+'" w:after="'+(o.aft||0)+'"/>'+(o.jc?'<w:jc w:val="'+o.jc+'"/>':'')+'</w:pPr>'+inner+'</w:p>';
  const cell = (w, inner, o={}) => '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'
    +(o.fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.fill+'"/>':'')+'<w:vAlign w:val="center"/></w:tcPr>'+para(inner,{jc:o.jc,keep:o.keep})+'</w:tc>';
  /* Tableau des exercices : n°, sujet, verbe, (temps), conjugaison — la colonne « Temps » disparaît dans une série par temps */
  /* Marges gauche/droite : 2 cm, ou 1,5 cm quand il y a une colonne « temps » (plusieurs temps cochés),
     pour garder de la place pour écrire dans la dernière colonne. SIDE et TW sont fixés par documentXml. */
  let SIDE = 1134, TW = 9638;                         /* marge latérale et largeur utile, en twips */
  /* Largeurs des colonnes : la dernière prend toute la place restante ; sujet assez large pour « ma sœur et ma cousine » */
  const widths = showTense => showTense ? [600, 2300, 1500, 1850, TW-6250] : [600, 2400, 1700, TW-4700];
  function table(items, key, showTense){
    const W = widths(showTense);
    const head = ['n°','sujet','verbe',...(showTense?['temps']:[]),'réponse'];
    const B = '<w:top w:val="single" w:sz="4" w:color="808080"/><w:left w:val="single" w:sz="4" w:color="808080"/><w:bottom w:val="single" w:sz="4" w:color="808080"/><w:right w:val="single" w:sz="4" w:color="808080"/><w:insideH w:val="single" w:sz="4" w:color="808080"/><w:insideV w:val="single" w:sz="4" w:color="808080"/>';
    let rows = '<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>'
      + head.map((h,i) => cell(W[i], tR(h,{b:true,sz:26}), {fill:'EDEDED', jc:'center', keep:true})).join('') + '</w:tr>';
    items.forEach((it,r) => {
      const keep = r < items.length-1;
      const vals = [tR(String(r+1)), tR(it.s), tR(it.v), ...(showTense?[tR(it.t)]:[]), key ? ansRuns(answerSegments(it)) : ''];
      rows += '<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="'+ROW_H+'" w:hRule="atLeast"/></w:trPr>'
        + vals.map((c,i) => cell(W[i], c, {jc:'center', keep})).join('') + '</w:tr>';
    });
    return '<w:tbl><w:tblPr><w:tblW w:w="'+TW+'" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>'+B+'</w:tblBorders><w:tblLayout w:type="fixed"/>'
      +'<w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'
      + W.map(w => '<w:gridCol w:w="'+w+'"/>').join('') + '</w:tblGrid>' + rows + '</w:tbl>';
  }
  const head = (txt,sz,bef,pb,u) => para(tR(txt,{b:true,sz,u}),{jc:'center',keep:true,bef,aft:100,pb});
  /* Consigne : avec un seul temps, il est écrit en gras souligné (« au présent », « à l'imparfait »…) */
  const consigne = t => para(t
      ? tR('Conjugue chaque verbe avec son sujet '+(t==='imparfait'?'à ':'au '),{sz:26,b:true}) + tR(t==='imparfait'?'l’imparfait':t,{sz:26,b:true,u:true}) + tR('.',{sz:26,b:true})
      : tR('Conjugue chaque verbe avec son sujet au temps demandé.',{sz:26,b:true}), {keep:true,aft:120});   /* 13 pt, gras */
  const nameTabs = () => '<w:tabs><w:tab w:val="left" w:pos="'+Math.round(TW*.59)+'" w:leader="underscore"/><w:tab w:val="right" w:pos="'+TW+'" w:leader="underscore"/></w:tabs>';
  const nameLine = (pb,keep) => para(tR('Prénom : ')+'<w:r><w:tab/></w:r>'+tR('     Date : ')+'<w:r><w:tab/></w:r>',{tabs:nameTabs(),aft:140,pb,keep});
  const CUT = '<w:p><w:pPr><w:pBdr><w:bottom w:val="dashed" w:sz="6" w:space="1" w:color="000000"/></w:pBdr><w:spacing w:before="160" w:after="200"/></w:pPr></w:p>';
  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const sect = (ref,m=850) => '<w:sectPr>'+ref+'<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="'+m+'" w:right="'+SIDE+'" w:bottom="'+m+'" w:left="'+SIDE+'" w:header="400" w:footer="400" w:gutter="0"/></w:sectPr>';
  const HREF = id => '<w:headerReference w:type="default" r:id="'+id+'"/>';
  const XH = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const hdrXml = inner => XH+'<w:hdr '+NS+'>'+inner+'</w:hdr>';
  /* o = {sections:[{title, tense, items}], key, copies: 1|2|3, name}
     Prénom et date : une feuille d'élève = une seule mention (en-tête de page) ; fiches à découper = une mention par exemplaire */
  const ROW_H = 567;                                  /* hauteur des cases : 1 cm */
  const margin = k => k===2 ? 567 : 850;            /* 2 exemplaires par page : marges haut et bas de 1 cm */
  /* place disponible par ligne (twips), d'après une estimation des titres, consigne et en-têtes : sert à prévenir si ça ne tient pas */
  function rowRoom(o){
    const k = o.copies||1, rows = o.sections.reduce((a,x)=>a+x.items.length,0);
    const fixed = 1300 + (k>1 ? 350 : 0) + o.sections.filter(x=>x.title).length*480 + o.sections.length*380;
    return ((16838 - 2*margin(k))/k - fixed - 150) / Math.max(1,rows);
  }
  /* o = {sections:[{title, tense, items}], key, copies: 1|2|3, name}
     Prénom et date : une feuille d'élève = une seule mention (en-tête de page) ; fiches à découper = une mention par exemplaire */
  function documentXml(o){
    const k = o.copies||1, hdr = !!o.name && k===1, mar = margin(k);
    const wide = o.sections.some(x => !x.tense);       /* colonne « temps » présente */
    SIDE = wide ? 850 : 1134; TW = 11906 - 2*SIDE;
    const one = o.sections.length===1 && o.sections[0].tense ? o.sections[0].tense : null;   /* un seul temps : dans la consigne */
    const series = (s,i,key) => (s.title ? head(s.title,24,i?240:60,false,true) : '') + table(s.items, key, !s.tense);
    let b = '';
    if(k===1){
      b += head('Conjugaison',32,0,false,true) + consigne(one);   /* titre toujours souligné */
      o.sections.forEach((s,i) => { b += series(s,i,false); });
    }else{                                     /* chaque exemplaire = toutes les séries à la suite ; traits de coupe entre exemplaires */
      for(let c=0; c<k; c++){
        if(c>0) b += CUT;
        if(o.name) b += nameLine(false,true);
        b += head('Conjugaison',26,0,false,true) + consigne(one);
        o.sections.forEach((s,i) => { b += series(s,i,false); });
      }
    }
    if(o.key){
      if(hdr) b += '<w:p><w:pPr>'+sect(HREF('rId2'),mar)+'</w:pPr></w:p>';
      b += head('Corrigé',32,0,!hdr);
      o.sections.forEach((s,i) => { b += series(s,i,true); });
    }
    return XH+'<w:document '+NS+'><w:body>'+b+sect(hdr?HREF(o.key?'rId3':'rId2'):'',mar)+'</w:body></w:document>';
  }
  const headerXml = () => hdrXml(nameLine(false,false)), emptyHeaderXml = () => hdrXml('<w:p/>');
  const STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Cambria" w:hAnsi="Cambria" w:cs="Cambria"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';
  const CT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/header2.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/></Types>';
  const RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const DRELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header2.xml"/></Relationships>';
  let T = null;
  function crc32(u){
    if(!T){T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0;}}
    let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;
  }
  function zip(files){
    const enc=new TextEncoder(),u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
    const date=((2026-1980)<<9)|(1<<5)|1;
    const parts=[],cen=[];let off=0;
    files.forEach(f=>{
      const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d),sz=d.length;
      const lh=Uint8Array.from([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(date),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
      parts.push(lh,nm,d);
      cen.push(Uint8Array.from([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(date),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
      off+=lh.length+nm.length+sz;
    });
    const cl=cen.reduce((a,x)=>a+x.length,0);
    const end=Uint8Array.from([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cl),...u32(off),0,0]);
    const all=[...parts,...cen,end],out=new Uint8Array(all.reduce((a,x)=>a+x.length,0));let p=0;
    all.forEach(x=>{out.set(x,p);p+=x.length;});return out;
  }
  function build(o){
    return zip([{name:'[Content_Types].xml',data:CT},{name:'_rels/.rels',data:RELS},{name:'word/document.xml',data:documentXml(o)},{name:'word/styles.xml',data:STYLES},{name:'word/header1.xml',data:headerXml()},{name:'word/header2.xml',data:emptyHeaderXml()},{name:'word/_rels/document.xml.rels',data:DRELS}]);
  }
  return {build, documentXml, rowRoom};
})();

/* ---------- 4. Fenêtre « Imprimer » : options de la fiche (mémorisées), contrôles, création du fichier ---------- */
const pp = document.getElementById('pp'), btnPrint = document.getElementById('btnPrint');
const PKEY = 'machine-conjugaison-print';
const pv = n => { const e = pp.querySelector('input[name="'+n+'"]:checked'); return e ? e.value : null; };
const printOpen = () => pp.style.display==='block';
try{                                                   /* réglages de la dernière fiche */
  const o = JSON.parse(localStorage.getItem(PKEY)||'null');
  if(o){
    const n = {6:5, 30:20}[o.n] || o.n;
    if(pp.querySelector('input[name="pn"][value="'+n+'"]')) pp.querySelectorAll('input[name="pn"]').forEach(e=>e.checked = e.value===String(n));
    pp.querySelectorAll('input[name="pm"]').forEach(e=>e.checked = e.value===o.m);
    pp.querySelectorAll('input[name="pc"]').forEach(e=>e.checked = e.value===String(o.c||1));
    document.getElementById('pk').checked = o.k!==false;
    document.getElementById('pname').checked = o.a!==false;
  }
}catch(e){}
function savePrint(){
  try{ localStorage.setItem(PKEY, JSON.stringify({n:+pv('pn'), m:pv('pm'), c:+pv('pc'),
    k:document.getElementById('pk').checked, a:document.getElementById('pname').checked})); }catch(e){}
}
/* Met à jour la fenêtre : résumé des réglages, exemplaires possibles, avertissements */
function ppInfo(){
  const prob = problem(), go = document.getElementById('ppgo');
  const nS = [...DATA.pronoms.map(x=>x.id),'gn','multi'].filter(id=>isOn('pron',id)).length, nV = verbsOn().length, nT = tensesOn().length;
  document.getElementById('ppsrc').textContent = prob
    ? prob
    : 'Les exercices suivent les Options : '+nT+' temps, '+nV+' verbe'+(nV>1?'s':'')+' et '+nS+' case'+(nS>1?'s':'')+' de sujets cochés.';
  go.disabled = !!prob;
  const n = +pv('pn'), mx = n<=5 ? 3 : n<=10 ? 2 : 1;      /* une fiche répétée doit tenir dans sa part de page */
  /* un seul temps coché : pas de séries par temps, le temps est écrit dans la consigne */
  const oneT = printTenses().length===1, sec = pp.querySelector('input[name="pm"][value="sec"]');
  sec.disabled = oneT;
  document.getElementById('ppm').textContent = oneT ? 'Un seul temps coché : il est écrit dans la consigne, sans colonne « temps ».' : '';
  pp.querySelectorAll('input[name="pc"]').forEach(e=>{
    e.disabled = +e.value > mx;
    if(e.checked && +e.value > mx) pp.querySelector('input[name="pc"][value="'+mx+'"]').checked = true;
  });
  document.getElementById('ppc').textContent = mx===1 ? 'Possible avec 5 verbes (3 fiches) ou 10 verbes (2 fiches).' : 'Même fiche répétée, séparée par un trait de coupe.';
  document.getElementById('ppnote').textContent = (pv('pm')==='mix' || oneT) ? 'au total.' : 'par temps coché.';
  ppShort(n, prob);
  ppFit(n, prob);
}
/* Avertissement : réglages trop restreints pour fournir n exercices différents, ou passé simple impossible */
function ppShort(n, prob){
  const box = document.getElementById('ppshort'); box.style.display = 'none';
  if(prob) return;
  const msgs = [];
  if(pv('pm')==='sec' && printTenses().length>1 && tensesOn().length > printTenses().length)
    msgs.push('Le passé simple est limité à la 3ᵉ personne et aucun sujet de 3ᵉ personne n’est coché : pas de série au passé simple.');
  const secs = printSections(pv('pm'), n), short = secs.filter(s => s.items.length < n);
  if(short.length)
    msgs.push('Pas assez d’exercices différents avec les réglages actuels : '
      + short.map(s => (s.title ? s.title.toLowerCase()+' : ' : '') + s.items.length).join(', ')
      + ' verbes. La fiche sera plus courte.');
  if(msgs.length){ box.textContent = msgs.join(' '); box.style.display = 'block'; }
}
/* Avertissement : les exemplaires risquent de ne pas tenir sur une page A4 (hauteurs estimées en twips, comme dans le fichier Word) */
function ppFit(n, prob){
  const box = document.getElementById('ppcw'), k = +pv('pc'); box.style.display = 'none';
  if(prob) return;
  const secs = printSections(pv('pm'), n).map(x => ({title:x.title, items:{length:n}}));
  if(DOCX.rowRoom({sections:secs, copies:k}) >= 540) return;     /* des cases de 1 cm tiennent */
  const nS = secs.length;
  box.textContent = k===1
    ? 'La fiche ne tiendra pas sur une seule page A4 : elle sera sur plusieurs pages.'
    : nS+' série'+(nS>1?'s':'')+' par exemplaire : '+k+' exemplaires risquent de ne pas tenir sur une page A4. Choisis moins de temps, moins de verbes ou moins d’exemplaires.';
  box.style.display = 'block';
}
function closePP(){ pp.style.display = 'none'; btnPrint.setAttribute('aria-expanded','false'); }

  pp.style.display = 'block'; btnPrint.setAttribute('aria-expanded','true');
  const r = btnPrint.getBoundingClientRect(), w = pp.offsetWidth;
  pp.style.left = Math.min(Math.max(8, r.right-w), innerWidth-w-8)+'px';
  pp.style.top = (r.bottom+8)+'px';

pp.querySelectorAll('input').forEach(e => e.addEventListener('change', ()=>{ ppInfo(); savePrint(); }));
document.addEventListener('click', e => { if(printOpen() && !pp.contains(e.target) && e.target!==btnPrint) closePP(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && printOpen()){ closePP(); e.stopPropagation(); } }, true);
/* Création et téléchargement du fichier Word */
document.getElementById('ppgo').onclick = ()=>{
  if(problem()) return;
  const sections = printSections(pv('pm'), +pv('pn')).filter(s => s.items.length);
  const bytes = DOCX.build({sections, key:document.getElementById('pk').checked, copies:+pv('pc'), name:document.getElementById('pname').checked});
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'conjugaison.docx';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  closePP();
};
</script>
