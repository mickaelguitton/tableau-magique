// Droites toutes différentes
function exercicesFiche(nombre) {
  const liste = [], vues = new Set();
  for (let essai = 0; liste.length < nombre && essai < 500; essai++) {
    // En progressif, la fiche va du palier 1 au palier 3 ; sinon, le palier choisi
    const exo = genererExercice(etat.difficulte === 'prog' ? 1 + Math.floor(liste.length * 3 / nombre) : etat.difficulte);
    const signature = JSON.stringify([exo.a, exo.s, exo.n, exo.t, exo.den, exo.origine]);
    if (!vues.has(signature)) { vues.add(signature); liste.push(exo); }
  }
  return liste;
}

// Dessin d'une droite de la fiche ; renvoie la hauteur utile du dessin
function dessinerPourFiche(exo, mode, corrige) {
  /* Dessin resserré pour le papier : la droite est placée juste sous le cadre le plus haut possible
     (fraction ou non), la même pour l'exercice et le corrigé. */
  const cadre = mode === 'placer' ? partiesConsigne(exo) : partiesReponse(exo);
  const Y = 16 + (aUneFraction(cadre) ? 100 : 74) + 72, xCible = xDe(exo.t, exo.n);
  const basEtiquettes = Y + (aUneFraction(etiquetteGraduation(exo, 0)) ? 100 : 76);   // virgule des décimaux comprise
  dessinerDroite(exo.n, Y, i => longueurTrait(exo, i));
  dessinerEtiquettes(exo.n, Y, i => etiquetteGraduation(exo, i), false, 40, 22, 215);   // sur papier : bornes plus grandes
  if (mode === 'placer') {
    const bas = dessinerCadre(L / 2, [{ txt: 'Place ' }, ...partiesConsigne(exo)], COULEURS.vert);
    if (corrige) dessinerFleche(xCible, bas + 14, Y - 10, COULEURS.vert);
    return basEtiquettes;
  }
  const bas = dessinerCadre(xCible, corrige ? partiesReponse(exo) : null, COULEURS.orange);
  dessinerFleche(xCible, bas + 8, Y - 10, COULEURS.orange);
  if (etat.reponse !== 'entourer') return basEtiquettes;
  /* 6 propositions sous la droite (au corrigé, la bonne est entourée en vert).
     Sur une ligne si elles tiennent en taille 30 au moins, sinon sur deux lignes de 3. */
  const P = exo.propositions, ecart = 20, haut = P.liste.some(aUneFraction) ? 96 : 70;
  const mesurer = (T, parLigne) => {
    const largeurs = P.liste.map(p => Math.max(100, largeurParties(p, T) + 30));
    const lignes = [largeurs.slice(0, parLigne), largeurs.slice(parLigne)].filter(l => l.length);
    const tient = lignes.every(l => l.reduce((a, b) => a + b, 0) + ecart * (l.length - 1) <= L - 10);
    return { T, parLigne, largeurs, tient };
  };
  const T0 = P.liste.some(aUneFraction) ? 44 : 36;   // fractions écrites plus grand : elles sont étroites
  let m = mesurer(T0, 6);
  while (!m.tient && m.T > 30) m = mesurer(m.T - 1, 6);
  if (!m.tient) { m = mesurer(T0, 3); while (!m.tient && m.T > 16) m = mesurer(m.T - 1, 3); }
  const nbLignes = Math.ceil(6 / m.parLigne);
  for (let r = 0; r < nbLignes; r++) {
    const ks = [...Array(m.parLigne).keys()].map(k => k + r * m.parLigne);
    let x = (L - ks.reduce((a, k) => a + m.largeurs[k], 0) - ecart * (ks.length - 1)) / 2;
    const y = basEtiquettes + 14 + r * (haut + 12);
    for (const k of ks) {
      const p = P.liste[k], w = m.largeurs[k], juste = corrige && k === P.juste;
      el('rect', { x, y, width: w, height: haut, rx: 14, fill: '#fff',
                   stroke: juste ? COULEURS.vert : COULEURS.noir, 'stroke-width': juste ? 7 : 3 }, svg);
      dessinerParties(svg, p, x + w / 2, y + haut / 2, m.T, COULEURS.noir);
      x += w + ecart;
    }
  }
  return basEtiquettes + 14 + nbLignes * (haut + 12);
}

// Transforme une droite en image PNG ; renvoie { octets, rapport hauteur / largeur }
const ESPACE_DROITES_CM = 0.25;   // espace sous chaque droite de la fiche

async function imageDroite(exo, mode, corrige, numero) {
  const image = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const ecran = svg;
  svg = image;
  let hauteur;
  try { hauteur = dessinerPourFiche(exo, mode, corrige); } finally { svg = ecran; }

  // Le CSS de la page ne suit pas l'image : on écrit les couleurs directement dans le dessin
  image.querySelectorAll('.segment').forEach(r => {
    if (etat.couleurs) r.setAttribute('fill', r.classList.contains('s0') ? '#ffd3bf' : '#bfe5df');
    else r.remove();
  });
  if (etat.couleurs) {
    image.querySelectorAll('.axe').forEach(a => a.setAttribute('stroke-width', 0));
    image.querySelectorAll('.graduation').forEach(a => a.setAttribute('stroke-width', 5));
  }
  // Numéro de l'exercice dans une marge à gauche : il ne peut ni gêner le dessin ni se séparer de sa droite
  const MARGE = 70, MARGE_DROITE = 40;   // la grande borne de droite peut déborder un peu
  el('text', { x: -MARGE + 6, y: 50, 'font-size': 38, 'font-weight': 700, fill: COULEURS.noir }, image).textContent = numero + '.';
  const largeurTotale = L + MARGE + MARGE_DROITE, largeurPx = 2400, hauteurPx = Math.round(largeurPx * hauteur / largeurTotale);
  Object.entries({ viewBox: `${-MARGE} 0 ${largeurTotale} ${hauteur}`, width: largeurPx, height: hauteurPx, 'font-family': POLICE })
    .forEach(([k, v]) => image.setAttribute(k, v));

  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(image)], { type: 'image/svg+xml' }));
  const img = new Image();
  await new Promise((ok, erreur) => { img.onload = ok; img.onerror = erreur; img.src = url; });
  const toile = document.createElement('canvas');
  toile.width = largeurPx; toile.height = hauteurPx;
  const ctx = toile.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, largeurPx, hauteurPx);
  ctx.drawImage(img, 0, 0);
  URL.revokeObjectURL(url);
  const blob = await new Promise(ok => toile.toBlob(ok, 'image/png'));
  return { octets: new Uint8Array(await blob.arrayBuffer()), rapport: hauteur / largeurTotale };
}

/* ---------- Fabrication du fichier .docx (archive zip sans compression) ---------- */

const TABLE_CRC = Uint32Array.from({ length: 256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});
function crc32(d) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < d.length; i++) c = TABLE_CRC[(c ^ d[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function creerZip(fichiers) {
  const enc = new TextEncoder(), morceaux = [], central = [];
  let position = 0;
  for (const f of fichiers) {
    const nom = enc.encode(f.nom), d = typeof f.donnees === 'string' ? enc.encode(f.donnees) : f.donnees, crc = crc32(d);
    const local = new DataView(new ArrayBuffer(30));          // en-tête local
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
    local.setUint16(12, 0x21, true); local.setUint32(14, crc, true);
    local.setUint32(18, d.length, true); local.setUint32(22, d.length, true); local.setUint16(26, nom.length, true);
    morceaux.push(new Uint8Array(local.buffer), nom, d);
    const entree = new DataView(new ArrayBuffer(46));         // entrée du répertoire central
    entree.setUint32(0, 0x02014b50, true); entree.setUint16(4, 20, true); entree.setUint16(6, 20, true);
    entree.setUint16(8, 0x0800, true); entree.setUint16(14, 0x21, true); entree.setUint32(16, crc, true);
    entree.setUint32(20, d.length, true); entree.setUint32(24, d.length, true); entree.setUint16(28, nom.length, true);
    entree.setUint32(42, position, true);
    central.push(new Uint8Array(entree.buffer), nom);
    position += 30 + nom.length + d.length;
  }
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, fichiers.length, true); fin.setUint16(10, fichiers.length, true);
  fin.setUint32(12, central.reduce((t, m) => t + m.length, 0), true); fin.setUint32(16, position, true);
  return new Blob([...morceaux, ...central, new Uint8Array(fin.buffer)],
                  { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

const xml = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const POLICE_WORD = '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>';

// Un paragraphe Word ; o = { taille (pt), gras, couleur, centre, apres (pt), sautDePage }
function paragraphe(texte, o = {}) {
  const pPr = (o.sautDePage ? '<w:pageBreakBefore/>' : '') +
              `<w:spacing w:before="0" w:after="${(o.apres ?? 6) * 20}"/>` + (o.centre ? '<w:jc w:val="center"/>' : '');
  const rPr = POLICE_WORD + (o.gras ? '<w:b/>' : '') + (o.couleur ? `<w:color w:val="${o.couleur}"/>` : '') +
              `<w:sz w:val="${(o.taille || 12) * 2}"/>`;
  return `<w:p><w:pPr>${pPr}</w:pPr><w:r><w:rPr>${rPr}</w:rPr><w:t xml:space="preserve">${xml(texte)}</w:t></w:r></w:p>`;
}

// Le numéro de la droite (gardé avec l'image), puis l'image centrée
function paragrapheImage(id, rapport, largeurCm) {
  const cx = Math.round(largeurCm * 360000), cy = Math.round(cx * rapport);   // 1 cm = 360 000 EMU
  return `<w:p><w:pPr><w:spacing w:before="0" w:after="${ESPACE_DROITES_CM * 567 | 0}" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>` +
    `<w:r><w:drawing>` +
    `<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Droite ${id}"/>` +
    `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic>` +
    `<pic:nvPicPr><pic:cNvPr id="${id}" name="droite${id}.png"/><pic:cNvPicPr/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="rIdImage${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
    `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}

async function creerFicheWord() {
  const bouton = document.getElementById('ficheCreer');
  bouton.disabled = true; bouton.textContent = 'Création…';
  try {
    const { nombre, prenom, corrige } = reglagesFiche, mode = etat.mode;
    const exercices = exercicesFiche(nombre);
    const images = [];                     // { octets, rapport, id } : exercices puis corrigés
    for (const passe of corrige ? [false, true] : [false]) {
      for (const [k, exo] of exercices.entries()) images.push({ ...(await imageDroite(exo, mode, passe, k + 1)), id: images.length + 1 });
    }

    /* Une page pour les exercices, une page pour le corrigé : 26,7 cm utiles (A4, marges 1,5 cm).
       On retire le plus haut des deux en-têtes (consigne et prénom / titre « Corrigé » et signature)
       et une marge de sécurité, puis on partage entre les droites. */
    const entetePage1 = 1.0 + (prenom ? 1.1 : 0), entetePage2 = corrige ? 1.1 + 0.45 : 0;
    const hauteurUtile = 26.7 - Math.max(entetePage1, entetePage2) - 0.6;
    const rapport = Math.max(...images.map(im => im.rapport));
    const largeurCm = Math.min(18, (hauteurUtile / nombre - ESPACE_DROITES_CM) / rapport);

    let corps = (prenom ? paragraphe('Prénom : ……………………………………………', { taille: 13, apres: 14 }) : '') +
                paragraphe(consigneFiche(mode), { taille: 13, gras: true, apres: 10 });
    images.forEach((im, k) => {
      if (k === nombre) corps += paragraphe('Corrigé', { taille: 16, gras: true, couleur: 'FF6B35', apres: 10, sautDePage: true });
      corps += paragrapheImage(im.id, im.rapport, largeurCm);
    });
    if (corrige) corps += paragraphe(SIGNATURE, { taille: 8, couleur: '888888', centre: true });

    const entete = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const documentXml = entete +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
      'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      `<w:body>${corps}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>` +
      '<w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';
    const fichiers = [
      { nom: '[Content_Types].xml', donnees: entete +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/>' +
        '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>' },
      { nom: '_rels/.rels', donnees: entete +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>' },
      { nom: 'word/document.xml', donnees: documentXml },
      { nom: 'word/_rels/document.xml.rels', donnees: entete +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        images.map(im => `<Relationship Id="rIdImage${im.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/droite${im.id}.png"/>`).join('') +
        '</Relationships>' },
      ...images.map(im => ({ nom: `word/media/droite${im.id}.png`, donnees: im.octets }))
    ];

    const lien = document.createElement('a');
    lien.href = URL.createObjectURL(creerZip(fichiers));
    lien.download = `route-des-nombres-${mode}.docx`;
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    setTimeout(() => URL.revokeObjectURL(lien.href), 10000);
    fenetreFiche.hidden = true;
  } finally {
    bouton.disabled = false; bouton.textContent = 'Créer la fiche Word';
  }
}

document.getElementById('imprimer').onclick = () => { majFenetreFiche(); fenetreFiche.hidden = false; };
document.getElementById('ficheAnnuler').onclick = () => { fenetreFiche.hidden = true; };
document.getElementById('ficheCreer').onclick = creerFicheWord;
fenetreFiche.addEventListener('click', e => { if (e.target === fenetreFiche) fenetreFiche.hidden = true; });

/* =====================================================================
   9. VÉRIFICATION AUTOMATIQUE
   Ouvrir le fichier avec « #verifier » à la fin de l'adresse (ex. route-des-nombres.html#verifier) :
   3 000 droites par niveau sont générées et contrôlées, et le bilan s'affiche.
   Contrôles : bornes dans l'ordre et dans la limite du niveau ; nombre cherché strictement
   entre les bornes ; étiquettes exactes et pas régulier ; réponse et consigne justes ;
   6 propositions de valeurs différentes, une seule juste, jamais une borne, au plus une
   « loin » de la droite ; lettres de « Placer » contenant la bonne graduation.
   ===================================================================== */
function verifier(nombre = 3000) {
  const sauvegarde = { type: etat.type, niveau: { ...etat.niveau } };
  const exacte = (e, i) => e.genre === 'nombre' ? (e.a + i * e.s) / 10 ** e.scale : (e.origine + i) / e.den;
  const egal = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a));
  const LIMITE = { c0:10, i0:1e2, i1:1e3, i2:1e4, i3:1e6, i4:1e9 };
  const lignes = [];
  for (const type of Object.keys(NIVEAUX)) for (const { id, nom } of NIVEAUX[type]) {
    etat.type = type; etat.niveau[type] = id;
    const pb = {}, note = m => pb[m] = (pb[m] || 0) + 1;
    for (let k = 0; k < nombre; k++) {
      const e = genererExercice(1 + k % 3), d = exacte(e, 0), f = exacte(e, e.n), vj = exacte(e, e.t);   // les 3 paliers
      if (!(e.n >= 3)) note('droite trop courte');
      // chaque écriture de la réponse (séparées par « = ») vaut le nombre cherché
      const ecritures = [[]];
      for (const x of partiesReponse(e)) {
        if (x.txt !== undefined && x.txt.includes('=')) { const suite = x.txt.split('=')[1]; ecritures.push(suite.trim() ? [{ txt: suite }] : []); }
        else ecritures.at(-1).push(x);
      }
      if (ecritures.some(ec => !egal(valeurParties(ec), vj))) note('écriture de la réponse fausse');
      if (!(e.t >= 1 && e.t < e.n)) note('nombre cherché hors des bornes');
      if (!(d >= 0 && d < f) || (LIMITE[id] && f > LIMITE[id])) note('bornes incohérentes');
      for (let i = 0; i <= e.n; i++) {
        if (!egal(valeurParties(partiesGraduation(e, i)), exacte(e, i)) || !egal(valeurParties(etiquetteGraduation(e, i)), exacte(e, i))) note('étiquette fausse');
        if (i && !egal(exacte(e, i) - exacte(e, i - 1), (f - d) / e.n)) note('pas irrégulier');
      }
      if (!egal(valeurParties(partiesConsigne(e)), vj)) note('consigne fausse');
      const vals = e.propositions.liste.map(valeurParties), m = Math.max((f - d) / 2, 3 * (f - d) / e.n);
      if (vals.length !== 6 || new Set(vals.map(v => v.toFixed(9))).size !== 6) note('propositions pas toutes différentes');
      if (vals.filter(v => egal(v, vj)).length !== 1) note('pas exactement une bonne réponse');
      if (vals.some(v => egal(v, d) || egal(v, f))) note('borne proposée');
      if (vals.filter(v => v < d - m || v > f + m).length > 1) note('propositions trop loin');
      if (!graduationsLettrees(e).includes(e.t)) note('lettres sans la bonne graduation');
    }
    const bilan = Object.entries(pb).map(([m, n]) => `${m} (${n})`).join(', ');
    lignes.push(`${bilan ? '✗' : '✓'} ${NOM_TYPE[type]} ${nom} (paliers 1 à 3) : ${bilan || 'tout est juste'}`);
  }
  Object.assign(etat, { type: sauvegarde.type, niveau: sauvegarde.niveau });
  return lignes;
}

/* =====================================================================
   10. DÉMARRAGE
   ===================================================================== */
function demarrer() {
  choisirDepart(1, false);   // prépare l'exploration (ajustée à la classe ensuite)
  ajusterALaClasse();
  nouvelleDroite();
}
try {
  charger();
  demarrer();
} catch (e) {                // un réglage enregistré pose problème : on repart des réglages d'origine
  console.warn('Réglages enregistrés ignorés :', e);
  reglagesParDefaut();
  demarrer();
}
if (location.hash === '#verifier') {
  const lignes = verifier();
  zoneExplication.innerHTML = '<div style="text-align:left;font-size:.9rem;line-height:1.5">' +
    `<b>Vérification automatique : 3 000 droites par niveau</b><br>${lignes.join('<br>')}</div>`;
}
